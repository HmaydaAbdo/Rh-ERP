name: CI

# CI uniquement pour l'instant (pas de CD — voir docs/deployment.md) : les contrôles requis passent
# avant la construction et la publication des images Docker Hub. Sur une pull request, seuls les
# contrôles tournent (pas de publication — évite d'exposer les secrets Docker Hub à une PR non fiable).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Necessaire a l'initialisation du sous-systeme de polices AWT (GraphicsEnvironment) sur un
      # runner CI nu, sans quoi le rendu SVG des graphiques du rapport de paie (Batik, voir
      # RapportRessourcesStatiques) peut echouer au demarrage headless. Ancien commentaire
      # ("Install fonts for the PDF report") datait du pipeline JasperReports/JFreeChart, retire le
      # 2026-09-29 (voir docs/report/README.md) - le besoin AWT/Batik sous-jacent reste le meme,
      # jamais verifie comme superflu, donc conserve par prudence.
      - name: Install fonts for AWT/SVG chart rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Set up Node for coverage gate
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      # uv sert aux clients MCP Python du service IA : preuve de bout en bout sur /mcp (McpClientPythonIntegrationTest)
      # et preuve de compatibilité du profil mcp-compatibility. Versions figées par ia/uv.lock.
      - name: Install uv for the Python MCP client
        run: pipx install uv==0.12.2

      - name: Run backend tests
        working-directory: backend
        # mvnw doit être exécutable — le bit d'exécution a été perdu une première fois lors d'un
        # commit fait depuis Windows (git ne suit pas les permissions Unix nativement sur cet OS) ;
        # ce chmod est une garde permanente, peu coûteuse, contre une régression future du même genre.
        run: |
          chmod +x mvnw
          ./mvnw -B -Dia.client-python=true test
        # Pas de variables DB_* : les tests d'intégration démarrent leur propre PostgreSQL 18 + pgvector (Testcontainers, Docker
        # est présent sur le runner) et publient ses coordonnées eux-mêmes.
        env:
          CHANTIER_SYNC_BASE_URL: http://example.invalid/webServiceBS/getChantiers
          JWT_SECRET: Y2ktdGVzdC1zZWNyZXQtbmV2ZXItdXNlLWluLXByb2Q9MTIzNA==
          FRONTEND_URL: http://localhost:4200
          CORS_ALLOWED_ORIGINS: http://localhost:4200
          COOKIE_SECURE: "false"
          ADMIN_USERNAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: ci-admin-password
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_AUTH: "false"
          SMTP_STARTTLS: "false"
          MAIL_FROM: noreply@example.invalid
          MCP_ENABLED: "false"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce backend coverage by domain
        run: node scripts/check-domain-coverage.mjs backend/target/site/jacoco/jacoco.xml

      # Couverture des tests (JaCoCo, générée par la phase test) : rapport HTML conservé comme artefact.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

      # Sécurité de la chaîne d'approvisionnement : SBOM CycloneDX des dépendances réellement résolues, puis analyse de
      # vulnérabilités (OSV-Scanner, sans clé ni compte) ; toute vulnérabilité connue fait échouer le job. Une exception
      # motivée et datée se déclare dans backend/osv-scanner.toml.
      - name: Generate SBOM
        working-directory: backend
        run: ./mvnw -B -q -DskipTests cyclonedx:makeBom

      - name: Scan dependencies for known vulnerabilities
        working-directory: backend
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.6.0 scan source --config=/src/osv-scanner.toml -L /src/target/bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: backend/target/bom.json

      # Le SDK MCP Java fait partie du livrable (route /mcp) ; aucun framework LLM n'entre dans le monolithe.
      - name: Verify runtime excludes LLM frameworks
        working-directory: backend
        run: |
          ./mvnw -B -ntp dependency:tree -Dscope=runtime -DoutputFile=target/runtime-dependencies.txt
          node -e 'const fs = require("node:fs"); const tree = fs.readFileSync("target/runtime-dependencies.txt", "utf8"); if (/org\.springframework\.ai:|dev\.langchain4j:|langgraph4j/.test(tree)) throw new Error("LLM framework in production runtime");'

      - name: Install and validate MCP test client
        working-directory: scripts/ia/mcp-compatibility
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm audit --audit-level=moderate

      - name: Verify MCP Java TypeScript and Python interoperability
        working-directory: backend
        run: ./mvnw -B -ntp -P mcp-compatibility -Dtest=McpCompatibilityTest test

      - name: Generate MCP test dependency SBOM
        working-directory: backend
        run: ./mvnw -B -ntp -P mcp-compatibility -DskipTests cyclonedx:makeBom

      - name: Scan MCP test dependencies for known vulnerabilities
        working-directory: backend
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.6.0 scan source --config=/src/osv-scanner.toml -L /src/target/mcp-compatibility/bom.json

      - name: Upload MCP compatibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-compatibility-results
          path: |
            backend/target/mcp-compatibility/surefire-reports
            backend/target/mcp-compatibility/client.tap
            backend/target/mcp-compatibility/client-python.txt
            backend/target/mcp-compatibility/bom.json
          if-no-files-found: warn
          retention-days: 14

  # Service IA Python et passerelle LiteLLM (docs/ia.md) : qualité du code et construction des images.
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Lint, type-check and test the IA service
        working-directory: ia
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -q

      - name: Read LiteLLM pools without calling any provider
        run: python3 litellm/test_providers.py --list

      - name: Build IA images
        run: |
          set -euo pipefail
          docker build --tag erp-rh-litellm:ci litellm
          docker build --tag erp-rh-ia:ci ia
          docker build --tag erp-rh-copilot-runtime:ci copilot-runtime

  performance-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install fonts for AWT/SVG chart rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Run approved PostgreSQL performance profile
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp '-Dperformance.profile=true' '-Dtest=PerformanceProfileTest' test
        env:
          CHANTIER_SYNC_BASE_URL: http://example.invalid/webServiceBS/getChantiers
          JWT_SECRET: Y2ktdGVzdC1zZWNyZXQtbmV2ZXItdXNlLWluLXByb2Q9MTIzNA==
          FRONTEND_URL: http://localhost:4200
          CORS_ALLOWED_ORIGINS: http://localhost:4200
          COOKIE_SECURE: "false"
          ADMIN_USERNAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: ci-admin-password
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_AUTH: "false"
          SMTP_STARTTLS: "false"
          MAIL_FROM: noreply@example.invalid
          MCP_ENABLED: "false"

      - name: Upload performance profile result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-profile
          path: backend/target/surefire-reports/TEST-staport.rh.paie.performance.PerformanceProfileTest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.angular/playwright-browsers

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vitest (runner Angular) dans un vrai Chromium : le navigateur est installé par Playwright.
      - name: Install Chromium for tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Enforce frontend coverage by domain
        working-directory: frontend
        run: node ../scripts/check-frontend-domain-coverage.mjs coverage/frontend/lcov.info

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build (verifies the production bundle compiles)
        working-directory: frontend
        run: npx ng build --configuration production

      # Parcours E2E (connexion, permissions, fonctions, paie, composants, téléphone) contre une API simulée, avec axe.
      - name: Run frontend E2E tests
        working-directory: frontend
        run: npm run e2e

      # L'audit reste bloquant pour livrer, mais les tests, la compilation et les parcours tournent même en cas d'alerte.
      - name: Audit dependencies and licences
        working-directory: frontend
        run: |
          npm run audit:deps
          npm run audit:licences
          npm sbom --omit=dev --sbom-format cyclonedx > sbom-frontend.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.cdx.json

      # Traces et rapport des parcours en échec, pour comprendre un échec propre au CI sans le rejouer.
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  full-stack:
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.angular/playwright-browsers
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: staport_rh
          POSTGRES_USER: staport
          POSTGRES_PASSWORD: staport-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staport -d staport_rh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
      - name: Start backend against PostgreSQL
        working-directory: backend
        run: |
          nohup java -jar target/*.jar > "$RUNNER_TEMP/erp-rh-backend.log" 2>&1 &
          for i in {1..60}; do curl --fail --silent http://localhost:8080/actuator/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/erp-rh-backend.log"
          exit 1
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: staport_rh
          DB_USER: staport
          DB_PASSWORD: staport-test-password
          DB_MIGRATION_USER: staport
          DB_MIGRATION_PASSWORD: staport-test-password
          PGAUDIT_ENABLED: "false"
          CHANTIER_SYNC_BASE_URL: http://example.invalid/webServiceBS/getChantiers
          JWT_SECRET: Y2ktdGVzdC1zZWNyZXQtbmV2ZXItdXNlLWluLXByb2Q9MTIzNA==
          FRONTEND_URL: http://localhost:4300
          CORS_ALLOWED_ORIGINS: http://localhost:4300
          COOKIE_SECURE: "false"
          ADMIN_USERNAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: ci-admin-password
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_AUTH: "false"
          SMTP_STARTTLS: "false"
          MAIL_FROM: noreply@example.invalid
          MCP_ENABLED: "false"
      - name: Install frontend and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run full-stack browser gate
        working-directory: frontend
        run: npx playwright test e2e/full-stack.spec.ts
        env:
          E2E_FULL_STACK: "1"
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password
          BACKEND_URL: http://localhost:8080

      - name: Upload full-stack failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-failure-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/erp-rh-backend.log
          if-no-files-found: warn
          retention-days: 7

  publish-images:
    needs: [backend, ia, performance-profile, frontend, full-stack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      # Construire toutes les images avant la connexion authentifiée au registre ou leur publication.
      # Un échec de build n'en publie ainsi aucune.
      - name: Build all images locally
        run: |
          set -euo pipefail
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-postgres:$GITHUB_SHA" database
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-backend:$GITHUB_SHA" backend
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-frontend:$GITHUB_SHA" frontend
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-backup:$GITHUB_SHA" backup
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-litellm:$GITHUB_SHA" litellm
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-ia:$GITHUB_SHA" ia
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-copilot-runtime:$GITHUB_SHA" copilot-runtime

      - name: Add release aliases
        run: |
          set -euo pipefail
          for image in postgres backend frontend backup litellm ia copilot-runtime; do
            repository="$DOCKERHUB_USERNAME/erp-rh-$image"
            source="$repository:$GITHUB_SHA"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              docker tag "$source" "$repository:latest"
            fi
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              docker tag "$source" "$repository:$GITHUB_REF_NAME"
            fi
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Les tests, le contrôle de couverture, les audits et les builds de toutes les images sont verts.
      - name: Publish validated images
        run: |
          set -euo pipefail
          for image in postgres backend frontend backup litellm ia copilot-runtime; do
            repository="$DOCKERHUB_USERNAME/erp-rh-$image"
            docker push "$repository:$GITHUB_SHA"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              docker push "$repository:latest"
            fi
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              docker push "$repository:$GITHUB_REF_NAME"
            fi
          done
