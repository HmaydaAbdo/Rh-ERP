name: CI

# CI uniquement pour l'instant (pas de CD — voir docs/deployment.md) : les contrôles requis passent
# avant la construction et la publication des images Docker Hub. Sur une pull request, seuls les
# contrôles tournent (pas de publication — évite d'exposer les secrets Docker Hub à une PR non fiable).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # API FastAPI (application unique, ADR 0016) : style, types, tests sur PostgreSQL réel (Testcontainers, Docker est présent
  # sur le runner), couverture par domaine, documentation alignée sur le code, puis chaîne d'approvisionnement.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node for the documentation and coverage gates
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: Install uv
        run: pipx install uv==0.12.2

      # WeasyPrint (rapports PDF) charge Pango et HarfBuzz ; les mêmes paquets que l'image api/Dockerfile.
      - name: Install PDF rendering libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install locked dependencies
        working-directory: api
        run: uv sync --locked

      - name: Lint and format (ruff)
        working-directory: api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (pyright, strict)
        working-directory: api
        run: uv run pyright

      # Pas de variables DB_* : les tests démarrent leur propre PostgreSQL 18 + pgvector (Testcontainers) et construisent le
      # schéma par Alembic.
      - name: Run API tests with coverage
        working-directory: api
        run: uv run pytest -q --cov=staport --cov-branch --cov-report=json:coverage.json

      - name: Enforce API coverage by domain
        run: node scripts/check-domain-coverage.mjs api/coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: api/coverage.json
          if-no-files-found: warn
          retention-days: 14

      # Chaque permission d'un routeur et chaque outil MCP figure dans la documentation de son domaine (README, RBAC).
      - name: Verify domain documentation covers permissions and MCP tools
        run: node scripts/check-docs-domaines.mjs .

      # Versions verrouillées, seuils de l'agent et nombre d'outils MCP consignés au plan IA = code (E5.5).
      - name: Verify AI documentation matches code
        run: node scripts/ia/check-docs-code.mjs .

      - name: Install and validate MCP test client
        working-directory: scripts/ia/mcp-compatibility
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm audit --audit-level=moderate

      # Sécurité de la chaîne d'approvisionnement : SBOM CycloneDX des dépendances de production résolues par uv, puis analyse
      # de vulnérabilités (OSV-Scanner, sans clé ni compte) sur le verrou ; toute vulnérabilité connue fait échouer le job.
      # Une exception motivée et datée se déclare dans api/osv-scanner.toml.
      - name: Generate SBOM
        working-directory: api
        run: uv export --locked --no-dev --format cyclonedx1.5 --preview-features sbom-export --output-file bom.json

      - name: Scan dependencies for known vulnerabilities
        run: docker run --rm -v "$PWD/api:/src:ro" ghcr.io/google/osv-scanner:v2.6.0 scan source --config=/src/osv-scanner.toml -L /src/uv.lock

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-api
          path: api/bom.json

  # Service IA Python et passerelle LiteLLM (docs/ia.md) : qualité du code et construction des images.
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Lint, type-check and test the IA service
        working-directory: ia
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -q

      # Lint du runtime CopilotKit (ESLint, configuration dans copilot-runtime/eslint.config.js).
      - name: Lint CopilotKit runtime
        working-directory: copilot-runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint

      - name: Read LiteLLM pools without calling any provider
        run: python3 litellm/test_providers.py --list

      - name: Build IA images
        run: |
          set -euo pipefail
          docker build --tag erp-rh-litellm:ci litellm
          docker build --tag erp-rh-ia:ci ia
          docker build --tag erp-rh-copilot-runtime:ci copilot-runtime
          docker build --tag erp-rh-phoenix:ci phoenix

  frontend:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.angular/playwright-browsers

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ESLint (angular-eslint, typescript-eslint) : toute erreur échoue ; les avertissements de dette sont plafonnés.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # Charte graphique : contraste de chaque couple de jetons dans les deux thèmes, aucun jeton de l'ancienne identité (E0.1).
      - name: Check design token contrast
        working-directory: frontend
        run: npm run check:contraste

      # Aucun composant visuel hors shared/ui/ : les infractions héritées ne peuvent que diminuer (E0.2).
      - name: Check shared component rule
        working-directory: frontend
        run: npm run check:composants

      # Propriétés logiques seulement : aucune position ni marge gauche/droite en dur, pour préparer l'arabe (E0.8).
      - name: Check logical properties
        working-directory: frontend
        run: npm run check:logique

      # Vitest (runner Angular) dans un vrai Chromium : le navigateur est installé par Playwright.
      - name: Install Chromium for tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Enforce frontend coverage by domain
        working-directory: frontend
        run: node ../scripts/check-frontend-domain-coverage.mjs coverage/frontend/lcov.info

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build (verifies the production bundle compiles)
        working-directory: frontend
        run: npx ng build --configuration production

      # Parcours E2E (connexion, permissions, fonctions, paie, composants, téléphone) contre une API simulée, avec axe.
      - name: Run frontend E2E tests
        working-directory: frontend
        run: npm run e2e

      # L'audit reste bloquant pour livrer, mais les tests, la compilation et les parcours tournent même en cas d'alerte.
      - name: Audit dependencies and licences
        working-directory: frontend
        run: |
          npm run audit:deps
          npm run audit:licences
          npm sbom --omit=dev --sbom-format cyclonedx > sbom-frontend.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.cdx.json

      # Traces et rapport des parcours en échec, pour comprendre un échec propre au CI sans le rejouer.
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  full-stack:
    needs: [api]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.angular/playwright-browsers
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: staport_rh
          POSTGRES_USER: staport
          POSTGRES_PASSWORD: staport-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staport -d staport_rh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        run: pipx install uv==0.12.2
      - name: Install locked API dependencies
        working-directory: api
        run: uv sync --locked --no-dev
      # Même chaîne que le déploiement : le compte propriétaire (staport) crée le schéma et le compte applicatif, l'API
      # ne se connecte qu'avec ce dernier.
      - name: Migrate the schema with Alembic
        working-directory: api
        run: uv run --no-sync python -m staport.migrations.deploiement
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: staport_rh
          DB_MIGRATION_USER: staport
          DB_MIGRATION_PASSWORD: staport-test-password
          DB_USER: staport_app
          DB_PASSWORD: staport-app-test-password
          PGAUDIT_ENABLED: "false"
      - name: Start the API against PostgreSQL
        working-directory: api
        run: |
          export MCP_JWT_PRIVATE_KEY="$(uv run --no-sync python -c 'import base64; from cryptography.hazmat.primitives import serialization as s; from cryptography.hazmat.primitives.asymmetric import rsa; k = rsa.generate_private_key(public_exponent=65537, key_size=3072); print(base64.b64encode(k.private_bytes(s.Encoding.DER, s.PrivateFormat.PKCS8, s.NoEncryption())).decode())')"
          nohup uv run --no-sync uvicorn staport.main:application --factory --host 0.0.0.0 --port 8080 > "$RUNNER_TEMP/erp-rh-api.log" 2>&1 &
          for i in {1..60}; do curl --fail --silent http://localhost:8080/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/erp-rh-api.log"
          exit 1
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: staport_rh
          DB_USER: staport_app
          DB_PASSWORD: staport-app-test-password
          CHANTIER_SYNC_BASE_URL: http://example.invalid/webServiceBS/getChantiers
          FRONTEND_URL: http://localhost:4300
          CORS_ALLOWED_ORIGINS: http://localhost:4300
          COOKIE_SECURE: "false"
          ADMIN_USERNAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: ci-admin-password
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_AUTH: "false"
          SMTP_STARTTLS: "false"
          MAIL_FROM: noreply@example.invalid
          MCP_ENABLED: "true"
          MCP_JWT_KEY_ID: ci-cle-1
          OTEL_SDK_DISABLED: "true"
      - name: Install frontend and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run full-stack browser gate
        working-directory: frontend
        run: npx playwright test e2e/full-stack.spec.ts
        env:
          E2E_FULL_STACK: "1"
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password
          BACKEND_URL: http://localhost:8080

      - name: Upload full-stack failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-failure-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/erp-rh-api.log
          if-no-files-found: warn
          retention-days: 7

  publish-images:
    needs: [api, ia, frontend, full-stack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      # Construire toutes les images avant la connexion authentifiée au registre ou leur publication.
      # Un échec de build n'en publie ainsi aucune.
      - name: Build all images locally
        run: |
          set -euo pipefail
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-postgres:$GITHUB_SHA" database
          docker build --file api/Dockerfile --tag "$DOCKERHUB_USERNAME/erp-rh-api:$GITHUB_SHA" .
          docker build --file api/Flyway.Dockerfile --tag "$DOCKERHUB_USERNAME/erp-rh-flyway-validate:$GITHUB_SHA" api
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-frontend:$GITHUB_SHA" frontend
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-backup:$GITHUB_SHA" backup
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-litellm:$GITHUB_SHA" litellm
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-ia:$GITHUB_SHA" ia
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-copilot-runtime:$GITHUB_SHA" copilot-runtime
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-phoenix:$GITHUB_SHA" phoenix
          docker build --tag "$DOCKERHUB_USERNAME/erp-rh-docs:$GITHUB_SHA" site

      - name: Add release aliases
        run: |
          set -euo pipefail
          for image in postgres api flyway-validate frontend backup litellm ia copilot-runtime phoenix docs; do
            repository="$DOCKERHUB_USERNAME/erp-rh-$image"
            source="$repository:$GITHUB_SHA"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              docker tag "$source" "$repository:latest"
            fi
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              docker tag "$source" "$repository:$GITHUB_REF_NAME"
            fi
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Les tests, le contrôle de couverture, les audits et les builds de toutes les images sont verts.
      - name: Publish validated images
        run: |
          set -euo pipefail
          for image in postgres api flyway-validate frontend backup litellm ia copilot-runtime phoenix docs; do
            repository="$DOCKERHUB_USERNAME/erp-rh-$image"
            docker push "$repository:$GITHUB_SHA"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              docker push "$repository:latest"
            fi
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              docker push "$repository:$GITHUB_REF_NAME"
            fi
          done
