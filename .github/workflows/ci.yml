name: CI

# CI uniquement pour l'instant (pas de CD — voir docs/deployment.md) : tests + build + push des
# images Docker Hub à chaque push sur main. Sur une pull request, seuls les tests tournent (pas de
# build/push d'image — évite d'exposer les secrets Docker Hub à une PR non fiable).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-postgres:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-postgres:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-postgres:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push PostgreSQL 18 with pgvector and pgAudit
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: database
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Necessaire a l'initialisation du sous-systeme de polices AWT (GraphicsEnvironment) sur un
      # runner CI nu, sans quoi le rendu SVG des graphiques du rapport de paie (Batik, voir
      # RapportRessourcesStatiques) peut echouer au demarrage headless. Ancien commentaire
      # ("Install fonts for the PDF report") datait du pipeline JasperReports/JFreeChart, retire le
      # 2026-09-29 (voir docs/report/README.md) - le besoin AWT/Batik sous-jacent reste le meme,
      # jamais verifie comme superflu, donc conserve par prudence.
      - name: Install fonts for AWT/SVG chart rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Run backend tests
        working-directory: backend
        # mvnw doit être exécutable — le bit d'exécution a été perdu une première fois lors d'un
        # commit fait depuis Windows (git ne suit pas les permissions Unix nativement sur cet OS) ;
        # ce chmod est une garde permanente, peu coûteuse, contre une régression future du même genre.
        run: |
          chmod +x mvnw
          ./mvnw -B test
        # Pas de variables DB_* : les tests d'intégration démarrent leur propre PostgreSQL 18 + pgvector (Testcontainers, Docker
        # est présent sur le runner) et publient ses coordonnées eux-mêmes.
        env:
          CHANTIER_SYNC_BASE_URL: http://example.invalid/webServiceBS/getChantiers
          JWT_SECRET: Y2ktdGVzdC1zZWNyZXQtbmV2ZXItdXNlLWluLXByb2Q9MTIzNA==
          FRONTEND_URL: http://localhost:4200
          COOKIE_SECURE: "false"
          ADMIN_USERNAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: ci-admin-password
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_AUTH: "false"
          SMTP_STARTTLS: "false"
          MAIL_FROM: noreply@example.invalid

      # Couverture des tests (JaCoCo, générée par la phase test) : rapport HTML conservé comme artefact.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 14

      # Sécurité de la chaîne d'approvisionnement : SBOM CycloneDX des dépendances réellement résolues, puis analyse de
      # vulnérabilités (OSV-Scanner, sans clé ni compte) ; toute vulnérabilité connue fait échouer le job. Une exception
      # motivée et datée se déclare dans backend/osv-scanner.toml.
      - name: Generate SBOM
        working-directory: backend
        run: ./mvnw -B -q -DskipTests cyclonedx:makeBom

      - name: Scan dependencies for known vulnerabilities
        working-directory: backend
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.6.0 scan source --config=/src/osv-scanner.toml -L /src/target/bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: backend/target/bom.json

      - name: Determine image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-backend:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-backend:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-backend:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vitest (runner Angular) dans un vrai Chromium : le navigateur est installé par Playwright.
      - name: Install Chromium for tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Sécurité de la chaîne d'approvisionnement : aucune vulnérabilité (niveau moyen et au-dessus), licences
      # autorisées, et SBOM CycloneDX conservé comme artefact.
      - name: Audit dependencies and licences
        working-directory: frontend
        run: |
          npm run audit:deps
          npm run audit:licences
          npm sbom --omit=dev --sbom-format cyclonedx > sbom-frontend.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.cdx.json

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build (verifies the production bundle compiles)
        working-directory: frontend
        run: npx ng build --configuration production

      # Parcours E2E (connexion, permissions, fonctions, paie, composants, téléphone) contre une API simulée, avec axe.
      - name: Run frontend E2E tests
        working-directory: frontend
        run: npm run e2e

      # Traces et rapport des parcours en échec, pour comprendre un échec propre au CI sans le rejouer.
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Determine image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-frontend:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-frontend:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-frontend:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  backup:
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine image tags
        if: github.event_name == 'push'
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-backup:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-backup:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/erp-rh-backup:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backup image
        uses: docker/build-push-action@v7
        with:
          context: backup
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
