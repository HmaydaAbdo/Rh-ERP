# Mises à jour de dépendances (conventions/security.md, chaîne d'approvisionnement) : une proposition groupée par trimestre et
# par écosystème, y compris les images Docker (la balise et l'empreinte) et les actions GitHub. Les alertes de sécurité
# (Dependabot alerts) se règlent dans les paramètres du dépôt, pas ici.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: quarterly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: quarterly
  # Composants IA (plan de travail IA, E0.2, couche 3) : un rythme mensuel, parce que ces bibliothèques publient souvent.
  # Les PR Dependabot lancent la CI automatiquement : décision du propriétaire du 2026-10-31.
  - package-ecosystem: uv
    directory: /ia
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      ia-python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /copilot-runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      copilot-runtime:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /ia
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /copilot-runtime
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: quarterly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      actions:
        patterns: ["*"]
