# Mises à jour de dépendances (conventions/security.md, chaîne d'approvisionnement) : une proposition groupée par trimestre et
# par écosystème, y compris les images Docker (la balise et l'empreinte) et les actions GitHub. Les alertes de sécurité
# (Dependabot alerts) se règlent dans les paramètres du dépôt, pas ici.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @angular/build 22.2.x n'accepte que TypeScript >=6.0 <6.1 (pair) : TypeScript 6.1 et 7 sont refusés à l'installation.
      # À retirer quand une version d'Angular déclare une plage plus large.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: quarterly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: quarterly
  # Composants IA (plan de travail IA, E1.2, couche 3) : un rythme mensuel, parce que ces bibliothèques publient souvent.
  # Les PR Dependabot lancent la CI automatiquement : décision du propriétaire du 2026-10-31.
  - package-ecosystem: uv
    directory: /ia
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      ia-python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /copilot-runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      copilot-runtime:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /ia
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /copilot-runtime
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: quarterly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      actions:
        patterns: ["*"]
