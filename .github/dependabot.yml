# Mises à jour de dépendances (conventions/security.md, chaîne d'approvisionnement) : une proposition groupée par mois et
# par écosystème (décision du propriétaire du 2026-11-09 : tout est mensuel, rien ne reste en retard), y compris les images Docker (la balise et l'empreinte) et les actions GitHub. Les alertes de sécurité
# (Dependabot alerts) se règlent dans les paramètres du dépôt, pas ici.
version: 2
updates:
  # API FastAPI (application unique, ADR 0016) : verrou uv et images de base, au même rythme mensuel que le service IA, parce
  # que FastAPI, Pydantic, SQLAlchemy et FastMCP publient souvent.
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      api-python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @angular/build 22.2.x n'accepte que TypeScript >=6.0 <6.1 (pair) : TypeScript 6.1 et 7 sont refusés à l'installation.
      # À retirer quand une version d'Angular déclare une plage plus large.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
  # Composants IA (plan de travail IA, E5.2, couche 3) : un rythme mensuel, parce que ces bibliothèques publient souvent.
  # Les PR Dependabot lancent la CI automatiquement : décision du propriétaire du 2026-10-31.
  - package-ecosystem: uv
    directory: /ia
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      ia-python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /copilot-runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      copilot-runtime:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /ia
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /copilot-runtime
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Écosystèmes ajoutés le 2026-11-09 : images Docker de l'ERP et du site de documentation, dépendances npm du site.
  - package-ecosystem: docker
    directory: /litellm
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /phoenix
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /database
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      site:
        patterns: ["*"]
