# Nginx inner — sert les fichiers statiques Angular (dist/frontend/browser) et fait office de
# reverse-proxy interne vers le backend Spring Boot pour les appels API, sur le réseau Docker
# (le backend n'est jamais exposé directement — voir docker-compose.yml). Nginx outer (hors de ce
# dépôt, géré sur le serveur de déploiement) est le seul point d'entrée public ; il ne parle qu'à
# ce service.
#
# Les préfixes d'API proxifiés ci-dessous reprennent exactement ceux du proxy de développement
# Angular (frontend/proxy.conf.js) : /auth, /users, /roles, /permissions n'ont aucune route Angular
# de même nom (rien à désambiguïser). /employees, /chantiers, /functions, /equipes, /paie existent à la fois
# comme route Angular (page listant la ressource) et comme préfixe d'API (recherche, CRUD) — la
# même requête HTTP (ex. GET /employees/42) doit donc soit servir la page Angular (rechargement de
# page), soit être relayée au backend (appel XHR), selon qu'elle vient d'une navigation ou d'un
# appel API : on distingue les deux par l'en-tête Accept, exactement comme le fait le `bypass` du
# proxy de développement (une navigation envoie `Accept: text/html`, `HttpClient` ne l'envoie
# jamais).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile   on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend {
        server backend:8080;
    }

    # Nginx outer termine le TLS et transmet X-Forwarded-Proto — le préserver plutôt que le
    # réécrire avec $scheme (qui vaudrait toujours "http" ici, la connexion outer→inner étant en
    # clair sur le réseau interne).
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck du conteneur (voir Dockerfile HEALTHCHECK) — ne transite jamais par le
        # backend, ne dépend d'aucune ressource externe.
        location = /health {
            default_type text/plain;
            return 200 "healthy";
        }

        # --- API : préfixes sans route Angular de même nom — relais direct, sans ambiguïté ---
        # Regex ancrée sur le segment de chemin ("(/|$)") : évite qu'un préfixe comme /users ne
        # capture aussi par erreur une ressource sans rapport telle que /usersXYZ.
        location ~ ^/(auth|users|roles|permissions|swagger-ui|v3/api-docs)(/|$) {
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location = /actuator/health {
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        # --- API : préfixes qui coïncident avec une route Angular — une navigation (Accept:
        # text/html) sert la page Angular, tout le reste (appels HttpClient) part vers le backend.
        # "rewrite ... last" (pas "break") : "break" arrête la réécriture mais laisse le
        # `proxy_pass` du même bloc s'exécuter quand même sur l'URI réécrite — il faut "last" pour
        # relancer la recherche de location sur la nouvelle URI et atteindre le bloc dédié ci-dessous.
        location ~ ^/(employees|chantiers|functions|equipes|paie)(/|$) {
            if ($http_accept ~* "text/html") {
                rewrite ^ /__spa_fallback last;
            }
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location = /__spa_fallback {
            internal;
            try_files /index.html =404;
        }

        # --- Assets statiques : cache long terme (noms hashés par le build Angular — un nouveau
        # déploiement change le nom de fichier, jamais son contenu sous un même nom) ---
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- SPA fallback : toute autre route sert index.html, le routeur Angular prend le relais ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
