# Nginx inner — sert les fichiers statiques Angular (dist/frontend/browser) et fait office de
# reverse-proxy interne vers le backend Spring Boot pour les appels API, sur le réseau Docker
# (le backend n'est jamais exposé directement — voir docker-compose.yml). Nginx outer (hors de ce
# dépôt, géré sur le serveur de déploiement) est le seul point d'entrée public ; il ne parle qu'à
# ce service.
#
# Les préfixes d'API proxifiés ci-dessous reprennent exactement ceux du proxy de développement
# Angular (frontend/proxy.conf.js) : /auth, /users, /roles, /permissions n'ont aucune route Angular
# de même nom (rien à désambiguïser ; /logs est l'API du journal d'audit, dont l'écran Angular est /audit). /employees, /chantiers, /functions, /equipes, /paie existent à la fois
# comme route Angular (page listant la ressource) et comme préfixe d'API (recherche, CRUD) — la
# même requête HTTP (ex. GET /employees/42) doit donc soit servir la page Angular (rechargement de
# page), soit être relayée au backend (appel XHR), selon qu'elle vient d'une navigation ou d'un
# appel API : on distingue les deux par l'en-tête Accept, exactement comme le fait le `bypass` du
# proxy de développement (une navigation envoie `Accept: text/html`, `HttpClient` ne l'envoie
# jamais).

worker_processes auto;

# Processus non privilégié (image nginx-unprivileged) : le fichier du PID et les répertoires temporaires sont dans /tmp,
# seul endroit où l'utilisateur nginx peut écrire.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend {
        server backend:8080;
    }

    # --- Limite de débit (conventions/security.md) : par adresse du client réel, en 429 au-delà ---
    # Nginx outer est sur le même serveur : il atteint ce conteneur par la passerelle Docker (réseaux privés) et pose
    # X-Forwarded-For. Sans ces directives, $remote_addr serait celle de la passerelle pour tout le monde et
    # la limite deviendrait commune à tous les utilisateurs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Seules les écritures sont limitées : une navigation (GET text/html) vers /paie/export ne doit jamais être refusée.
    # Une clé vide n'est pas comptée.
    map $request_method $cle_ecriture {
        POST    $binary_remote_addr;
        default '';
    }

    # Essais de mot de passe : au plus 20 par minute et par adresse (rafale de 10 : plusieurs personnes derrière la
    # même adresse de l'entreprise se connectent en même temps le matin).
    limit_req_zone $binary_remote_addr zone=connexion:1m rate=20r/m;
    # Demande et consommation d'un lien de réinitialisation : un courriel part à chaque demande.
    limit_req_zone $binary_remote_addr zone=reinitialisation:1m rate=5r/m;
    # Renouvellement de la session : appelé par l'interface elle-même, donc plus large.
    limit_req_zone $binary_remote_addr zone=session:1m rate=120r/m;
    # Traitements coûteux (export, rapport PDF, imports, synchronisation, suppression en groupe).
    limit_req_zone $cle_ecriture zone=lourd:1m rate=30r/m;
    limit_req_status 429;

    # Nginx outer termine le TLS et transmet X-Forwarded-Proto — le préserver plutôt que le
    # réécrire avec $scheme (qui vaudrait toujours "http" ici, la connexion outer→inner étant en
    # clair sur le réseau interne).
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck du conteneur (voir Dockerfile HEALTHCHECK) — ne transite jamais par le
        # backend, ne dépend d'aucune ressource externe.
        location = /health {
            default_type text/plain;
            return 200 "healthy";
        }

        # --- API : préfixes sans route Angular de même nom — relais direct, sans ambiguïté ---
        # Les trois chemins d'authentification sensibles passent d'abord par leur limite de débit.
        location = /auth/login {
            limit_req zone=connexion burst=10 nodelay;
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location ~ ^/auth/(forgot-password|reset-password)$ {
            limit_req zone=reinitialisation burst=5 nodelay;
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location = /auth/refresh {
            limit_req zone=session burst=30 nodelay;
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        # Regex ancrée sur le segment de chemin ("(/|$)") : évite qu'un préfixe comme /users ne
        # capture aussi par erreur une ressource sans rapport telle que /usersXYZ.
        location ~ ^/(auth|users|roles|permissions|logs)(/|$) {
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location = /actuator/health {
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        # Les métriques (/actuator/prometheus) et tout autre endpoint de supervision restent internes : on ne les relaie pas, et on ne
        # laisse pas le repli SPA leur répondre une page HTML.
        location ^~ /actuator/ {
            return 404;
        }

        # --- API : préfixes qui coïncident avec une route Angular — une navigation (Accept:
        # text/html) sert la page Angular, tout le reste (appels HttpClient) part vers le backend.
        # "rewrite ... last" (pas "break") : "break" arrête la réécriture mais laisse le
        # `proxy_pass` du même bloc s'exécuter quand même sur l'URI réécrite — il faut "last" pour
        # relancer la recherche de location sur la nouvelle URI et atteindre le bloc dédié ci-dessous.
        # Mêmes chemins que le bloc suivant, avec la limite des traitements coûteux (une location à expression régulière
        # est choisie dans l'ordre du fichier : ce bloc doit précéder le général).
        location ~ ^/(paie/(export|report|import|suppression)|employees/import|functions/import|chantiers/sync)(/|$) {
            if ($http_accept ~* "text/html") {
                rewrite ^ /__spa_fallback last;
            }
            limit_req zone=lourd burst=10 nodelay;
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location ~ ^/(employees|chantiers|functions|equipes|paie)(/|$) {
            if ($http_accept ~* "text/html") {
                rewrite ^ /__spa_fallback last;
            }
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        location = /__spa_fallback {
            internal;
            try_files /index.html =404;
        }

        # --- Assets statiques : cache long terme (noms hashés par le build Angular — un nouveau
        # déploiement change le nom de fichier, jamais son contenu sous un même nom) ---
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- SPA fallback : toute autre route sert index.html, le routeur Angular prend le relais ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
