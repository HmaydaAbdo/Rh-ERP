@if (submitted()) {
  <stp-auth-card titre="Consultez votre messagerie" description="Si cette adresse correspond à un compte, un lien sécurisé vient d'être envoyé. Il est valable une heure.">
    <a routerLink="/login" class="app-link">Retour à la connexion</a>
  </stp-auth-card>
} @else {
  <stp-auth-card titre="Mot de passe oublié" description="Indiquez votre adresse email pour recevoir un lien sécurisé.">
    <form [formRoot]="form" class="app-form">
      <div class="field">
        <label for="email">Email</label>
        <input class="stp-input" id="email" type="email" [formField]="form.email" autocomplete="email" [attr.aria-invalid]="form.email().invalid() && form.email().touched()" aria-describedby="email-error" />
        <stp-field-error [field]="form.email" id="email-error" />
      </div>

      <button type="submit" stp-button class="app-form__submit" [loading]="form().submitting()">
        @if (form().submitting()) { Envoi en cours… } @else { Envoyer le lien }
      </button>
      <a routerLink="/login" class="app-link">Retour à la connexion</a>
    </form>
  </stp-auth-card>
}
