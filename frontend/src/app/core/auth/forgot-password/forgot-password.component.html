<main class="auth-page">
  <div class="auth-card">
    <img class="auth-card__logo" src="assets/brand/logo-staport.png" alt="Staport" width="160" height="81" />
    <h1>Mot de passe oublié</h1>

    @if (submitted()) {
      <p>Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé (valable 1 heure).</p>
      <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
    } @else {
      <form [formRoot]="form" class="auth-card">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" [formField]="form.email" autocomplete="email" [attr.aria-invalid]="form.email().invalid() && form.email().touched()" aria-describedby="email-error" />
          <stp-field-error [field]="form.email" id="email-error" />
        </div>

        <button type="submit" [disabled]="form().submitting()" class="auth-card__submit">
          @if (form().submitting()) { Envoi en cours… } @else { Envoyer le lien }
        </button>
        <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
      </form>
    }
  </div>
</main>
