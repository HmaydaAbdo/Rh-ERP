<div class="auth-page">
  <div class="auth-card">
    <img class="auth-card__logo" src="assets/brand/logo-staport.png" alt="Staport" width="160" height="81" />
    <h1>Mot de passe oublié</h1>

    @if (submitted()) {
      <p>Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé (valable 1 heure).</p>
      <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" aria-describedby="email-error" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <small id="email-error" class="field-error">Email invalide.</small>
          }
        </div>

        <button type="submit" [disabled]="submitting()" class="auth-card__submit">
          @if (submitting()) { Envoi en cours… } @else { Envoyer le lien }
        </button>
        <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
      </form>
    }
  </div>
</div>
