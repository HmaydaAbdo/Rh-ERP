<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <i class="pi pi-building-columns"></i>
      <span>Staport RH</span>
    </div>
    <h1>Mot de passe oublié</h1>

    @if (submitted) {
      <p>Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé (valable 1 heure).</p>
      <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
        <div class="field">
          <label for="email">Email</label>
          <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <small class="field-error">Email invalide.</small>
          }
        </div>

        <button pButton type="submit" label="Envoyer le lien" [loading]="submitting" [disabled]="submitting" class="auth-card__submit"></button>
        <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
      </form>
    }
  </div>
</div>
