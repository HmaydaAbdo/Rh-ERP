<div class="auth-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
    <div class="auth-card__brand">
      <i class="pi pi-building-columns"></i>
      <span>Staport RH</span>
    </div>
    <h1>Nouveau mot de passe</h1>

    @if (errorMessage) {
      <div class="auth-card__error">{{ errorMessage }}</div>
    }

    <div class="field">
      <label for="nouveauMotDePasse">Nouveau mot de passe</label>
      <p-password
        inputId="nouveauMotDePasse"
        formControlName="nouveauMotDePasse"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="auth-card__password"
      ></p-password>
      @if (form.controls.nouveauMotDePasse.invalid && form.controls.nouveauMotDePasse.touched) {
        <small class="field-error">{{ regle }}</small>
      }
    </div>

    <button
      pButton
      type="submit"
      label="Réinitialiser le mot de passe"
      [loading]="submitting"
      [disabled]="submitting || !token"
      class="auth-card__submit"
    ></button>

    <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
  </form>
</div>
