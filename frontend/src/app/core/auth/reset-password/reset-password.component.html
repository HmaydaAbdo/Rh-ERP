<stp-auth-card titre="Nouveau mot de passe" description="Choisissez un nouveau mot de passe pour votre compte.">
  <form [formRoot]="form" class="app-form">
    @if (errorMessage(); as message) {
      <stp-message severity="error" [text]="message" />
    }

    <div class="field">
      <label for="nouveauMotDePasse">Nouveau mot de passe</label>
      <stp-password-input inputId="nouveauMotDePasse" [formField]="form.nouveauMotDePasse" autocomplete="new-password" />
      <stp-field-error [field]="form.nouveauMotDePasse" id="password-error" />
    </div>

    <button type="submit" stp-button class="app-form__submit" [loading]="form().submitting()" [disabled]="!token()">
      @if (form().submitting()) { Réinitialisation en cours… } @else { Réinitialiser le mot de passe }
    </button>

    <a routerLink="/login" class="app-link">Retour à la connexion</a>
  </form>
</stp-auth-card>
