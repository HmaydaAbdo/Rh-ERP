<main class="auth-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
    <img class="auth-card__logo" src="assets/brand/logo-staport.png" alt="Staport" width="160" height="81" />
    <h1>Nouveau mot de passe</h1>

    @if (errorMessage(); as message) {
      <div class="auth-card__error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="nouveauMotDePasse">Nouveau mot de passe</label>
      <div class="auth-card__password">
        <input id="nouveauMotDePasse" [type]="passwordVisible() ? 'text' : 'password'" formControlName="nouveauMotDePasse" autocomplete="new-password" [attr.aria-invalid]="form.controls.nouveauMotDePasse.invalid && form.controls.nouveauMotDePasse.touched" aria-describedby="password-error" />
        <button type="button" class="auth-card__password-toggle" [attr.aria-pressed]="passwordVisible()" aria-controls="nouveauMotDePasse" (click)="togglePasswordVisibility()">
          {{ passwordVisible() ? 'Masquer' : 'Afficher' }}
          <span class="visually-hidden">le mot de passe</span>
        </button>
      </div>
      @if (form.controls.nouveauMotDePasse.invalid && form.controls.nouveauMotDePasse.touched) {
        <small id="password-error" class="field-error">{{ regle }}</small>
      }
    </div>

    <button type="submit" [disabled]="submitting() || !token()" class="auth-card__submit">
      @if (submitting()) { Réinitialisation en cours… } @else { Réinitialiser le mot de passe }
    </button>

    <a routerLink="/login" class="auth-card__forgot">Retour à la connexion</a>
  </form>
</main>
