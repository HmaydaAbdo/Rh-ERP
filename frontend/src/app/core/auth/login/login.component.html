<stp-auth-card titre="Bienvenue" description="Connectez-vous à votre compte.">
  <form [formRoot]="form" class="app-form">
    @if (errorMessage(); as message) {
      <stp-message severity="error" [text]="message" />
    }

    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input class="stp-input" id="username" type="text" [formField]="form.username" autocomplete="username" [attr.aria-invalid]="form.username().invalid() && form.username().touched()" aria-describedby="username-error" />
      <stp-field-error [field]="form.username" id="username-error" />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <stp-password-input inputId="password" [formField]="form.password" autocomplete="current-password" />
      <stp-field-error [field]="form.password" id="password-error" />
    </div>

    <button type="submit" stp-button class="app-form__submit" [loading]="form().submitting()">
      @if (form().submitting()) { Connexion en cours… } @else { Se connecter }
    </button>

    <a routerLink="/forgot-password" class="app-link">Mot de passe oublié ?</a>
  </form>
</stp-auth-card>
