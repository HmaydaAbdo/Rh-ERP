@if (multiple) {
  <p-multiSelect
    [options]="options"
    [ngModel]="internalMultipleValue"
    (ngModelChange)="onMultipleChange($event)"
    [optionLabel]="optionLabel"
    [dataKey]="dataKey"
    [placeholder]="placeholder"
    [filter]="true"
    [filterPlaceHolder]="filterPlaceholder"
    (onFilter)="onFilterInput($event.filter)"
    [lazy]="true"
    [virtualScroll]="true"
    [virtualScrollItemSize]="virtualScrollItemSize"
    (onLazyLoad)="onLazyLoad($event)"
    [loading]="loading"
    [disabled]="disabled"
    [appendTo]="appendTo"
    [display]="summaryLabel ? 'comma' : 'chip'"
    [maxSelectedLabels]="summaryLabel ? 1 : 3"
    [selectedItemsLabel]="summaryLabel ?? undefined"
    [ariaLabel]="ariaLabel ?? undefined"
    [inputId]="inputId ?? undefined"
    styleClass="lazy-select"
    panelStyleClass="lazy-select-panel"
  ></p-multiSelect>
} @else {
  <p-dropdown
    [options]="options"
    [ngModel]="internalSingleValue"
    (ngModelChange)="onSingleChange($event)"
    [optionLabel]="optionLabel"
    [dataKey]="dataKey"
    [placeholder]="placeholder"
    [filter]="true"
    [filterPlaceholder]="filterPlaceholder"
    (onFilter)="onFilterInput($event.filter)"
    [lazy]="true"
    [virtualScroll]="true"
    [virtualScrollItemSize]="virtualScrollItemSize"
    (onLazyLoad)="onLazyLoad($event)"
    [loading]="loading"
    [disabled]="disabled"
    [showClear]="showClear"
    [ariaLabel]="ariaLabel ?? undefined"
    [inputId]="inputId ?? undefined"
    [appendTo]="appendTo"
    styleClass="lazy-select"
    panelStyleClass="lazy-select-panel"
  ></p-dropdown>
}
