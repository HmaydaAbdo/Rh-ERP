<div class="stp-table" [class.stp-table--loading]="loading()" [attr.aria-busy]="loading()">
  <ag-grid-angular
    class="stp-table__grid"
    domLayout="autoHeight"
    [theme]="theme"
    [columnDefs]="colDefs()"
    [rowData]="displayed()"
    [pinnedBottomRowData]="pinnedBottom()"
    [loading]="loading()"
    [ensureDomOrder]="true"
    [suppressColumnVirtualisation]="true"
    [suppressRowVirtualisation]="true"
    [suppressMovableColumns]="!reorderable()"
    [suppressDragLeaveHidesColumns]="true"
    [suppressCellFocus]="false"
    [suppressNoRowsOverlay]="loading()"
    [noRowsOverlayComponent]="noRowsOverlay"
    [noRowsOverlayComponentParams]="noRowsParams()"
    [getRowClass]="getRowClass"
    (gridReady)="onGridReady($event)"
    (rowDataUpdated)="ajusterColonnes()"
    (firstDataRendered)="ajusterColonnes()"
    (sortChanged)="onSortChanged($event)"
    (columnMoved)="onColumnMoved($event)"
    (rowClicked)="onRowClicked($event)"
    (cellKeyDown)="onCellKeyDown($event)"
  />

  @if (paginated()) {
  <nav class="stp-table__paginator" aria-label="Pagination">
    <p class="stp-table__report" role="status">
      @if (total() > 0) {
        {{ first() + 1 }} - {{ lastRow() }} sur {{ total() }} — page {{ currentPage() }}/{{ pageCount() }}
      } @else {
        0 résultat
      }
    </p>
    <div class="stp-table__pager">
      <button stp-button variant="text" iconOnly icon="chevrons-left" aria-label="Première page" [disabled]="currentPage() === 1" (click)="goToPage(1)"></button>
      <button stp-button variant="text" iconOnly icon="chevron-left" aria-label="Page précédente" [disabled]="currentPage() === 1" (click)="goToPage(currentPage() - 1)"></button>
      <button stp-button variant="text" iconOnly icon="chevron-right" aria-label="Page suivante" [disabled]="currentPage() === pageCount()" (click)="goToPage(currentPage() + 1)"></button>
      <button stp-button variant="text" iconOnly icon="chevrons-right" aria-label="Dernière page" [disabled]="currentPage() === pageCount()" (click)="goToPage(pageCount())"></button>
      <label class="stp-table__rows">
        <span class="app-lecteur">Lignes par page</span>
        <stp-select [clearable]="false" ariaLabel="Lignes par page" placeholder="Lignes par page" [options]="rowsOptions()" [value]="rows()" (valueChange)="changeRows($event)" />
      </label>
    </div>
  </nav>
  }
</div>
