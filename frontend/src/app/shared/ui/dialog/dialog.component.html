<ng-template #panel>
  <section
    class="stp-dialog"
    [class.stp-dialog--drawer]="placement() === 'end'"
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    [attr.aria-labelledby]="titleId"
    [style.width]="width()"
  >
    <header class="stp-dialog__header">
      <h2 [id]="titleId">{{ header() }}</h2>
      @if (closable()) {
        <button stp-button variant="text" iconOnly icon="x" type="button" aria-label="Fermer" (click)="close()"></button>
      }
    </header>
    <div class="stp-dialog__body">
      <ng-content />
    </div>
    <footer class="stp-dialog__footer"><ng-content select="[stpDialogFooter]" /></footer>
  </section>
</ng-template>
