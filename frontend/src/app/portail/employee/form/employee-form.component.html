<div class="employee-form app-page app-page--narrow">
  <a routerLink="/employees" class="app-back"><stp-icon name="arrow-left" /> Employés</a>
  <div class="app-page__header">
    <h1>{{ isEditMode() ? "Modifier l'employé" : 'Nouvel employé' }}</h1>
  </div>

  <form [formRoot]="form" class="app-form__grid">
    <div class="field">
      <label for="nomPrenom">Nom &amp; prénom <span class="field__req" aria-hidden="true">*</span></label>
      <input class="stp-input" autocomplete="off" id="nomPrenom" type="text" [formField]="form.nomPrenom" />
      <stp-field-error [field]="form.nomPrenom" />
    </div>

    <div class="field">
      <label for="cin">CIN <span class="field__req" aria-hidden="true">*</span></label>
      <input class="stp-input" spellcheck="false" autocomplete="off" id="cin" type="text" [formField]="form.cin" />
      <stp-field-error [field]="form.cin" />
    </div>

    <div class="field">
      <label for="dateNaissance">Date de naissance <span class="field__req" aria-hidden="true">*</span></label>
      <stp-date-input inputId="dateNaissance" [formField]="form.dateNaissance" />
      <stp-field-error [field]="form.dateNaissance" />
    </div>

    <div class="field">
      <label for="dateEmbauche">Date d'embauche <span class="field__req" aria-hidden="true">*</span></label>
      <stp-date-input inputId="dateEmbauche" [formField]="form.dateEmbauche" />
      <stp-field-error [field]="form.dateEmbauche" />
    </div>

    <div class="field">
      <label for="fonctionId">Fonction <span class="field__req" aria-hidden="true">*</span></label>
      <app-lazy-select
        ariaLabel="Fonction" inputId="fonctionId"
        [formField]="form.fonctionId"
        [source]="functionReferenceService"
        optionLabel="libelle"
        placeholder="Sélectionner une fonction"
      ></app-lazy-select>
      <stp-field-error [field]="form.fonctionId" />
    </div>

    <div class="field">
      <label for="chantierId">Chantier <span class="field__req" aria-hidden="true">*</span></label>
      <app-lazy-select
        ariaLabel="Chantier" inputId="chantierId"
        [formField]="form.chantierId"
        [source]="chantierReferenceService"
        optionLabel="code"
        placeholder="Sélectionner un chantier"
      ></app-lazy-select>
      <stp-field-error [field]="form.chantierId" />
    </div>

    <div class="field">
      <label for="equipeId">Équipe</label>
      <app-lazy-select
        ariaLabel="Équipe" inputId="equipeId"
        [formField]="form.equipeId"
        [source]="equipeReferenceService"
        optionLabel="code"
        placeholder="Sans équipe"
      ></app-lazy-select>
    </div>

    @if (voitLaPaie()) {
      <div class="field">
        <label for="salaire">Salaire</label>
        <stp-number-input inputId="salaire" [formField]="form.salaire" [minFractionDigits]="2" />
        <stp-field-error [field]="form.salaire" />
      </div>

      <div class="field">
        <label for="typeSalaire">Type de salaire</label>
        <stp-select ariaLabel="Type de salaire" inputId="typeSalaire" [formField]="form.typeSalaire" [options]="typeSalaireOptions" placeholder="Non renseigné"></stp-select>
        <stp-field-error [field]="form.typeSalaire" />
      </div>
    }

    @if (isEditMode()) {
      <div class="field">
        <label for="statut">Statut <span class="field__req" aria-hidden="true">*</span></label>
        <stp-select ariaLabel="Statut" inputId="statut" [formField]="form.statut" [options]="statutOptions"></stp-select>
      </div>
    }

    <div class="app-form__actions">
      <a stp-button variant="text" routerLink="/employees">Annuler</a>
      <button stp-button type="submit" [loading]="form().submitting()">{{ isEditMode() ? 'Enregistrer' : 'Créer' }}</button>
    </div>
  </form>
</div>
