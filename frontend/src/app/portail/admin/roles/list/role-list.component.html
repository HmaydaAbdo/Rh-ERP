<p-confirmDialog></p-confirmDialog>

<div class="role-list">
  <div class="role-list__header">
    <h1>Rôles</h1>
    <button pButton type="button" icon="pi pi-plus" label="Nouveau rôle" routerLink="/admin/roles/new"></button>
  </div>

  <form [formGroup]="filterForm" class="role-list__filters" (ngSubmit)="$event.preventDefault()">
    <input pInputText type="text" formControlName="nom" placeholder="Nom" />
    <input pInputText type="text" formControlName="description" placeholder="Description" />
    <button pButton type="button" icon="pi pi-times" label="Réinitialiser" class="p-button-outlined" (click)="onResetFilters()"></button>
  </form>

  <app-column-chooser [state]="columns"></app-column-chooser>

  <p-table
    styleClass="app-table p-datatable-gridlines p-datatable-sm"
    #dt
    [value]="roles"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="rowsPerPage"
    [showCurrentPageReport]="true"
    [currentPageReportTemplate]="pageReport"
    [columns]="columns.visible"
    [resizableColumns]="true"
    columnResizeMode="expand"
    [reorderableColumns]="true"
    (onColReorder)="columns.onReorder($event.columns)"
    dataKey="id"
  >
    <ng-template pTemplate="header">
      <tr>
        @for (col of columns.visible; track col.field) {
          <th [pSortableColumn]="col.sortField ?? col.field" pResizableColumn pReorderableColumn [ngClass]="col.align">
            {{ col.header }} <p-sortIcon [field]="col.sortField ?? col.field"></p-sortIcon>
          </th>
        }
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-role>
      <tr>
        @for (col of columns.visible; track col.field) {
          <td [ngClass]="[col.align ?? '', col.cellClass ?? '']">
            @switch (col.field) {
              @case ('nom') {
                {{ role.nom }}
              }
              @case ('description') {
                {{ role.description || '—' }}
              }
              @case ('permissions') {
                <p-tag [value]="role.permissions.length + ' permission(s)'" severity="info"></p-tag>
              }
            }
          </td>
        }
        <td class="role-list__actions">
          <button pButton type="button" icon="pi pi-pencil" class="p-button-text" (click)="onEdit(role)"></button>
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            class="p-button-text p-button-danger"
            [loading]="deletingId === role.id"
            (click)="onDelete(role)"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns.visible.length + 1">Aucun rôle.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
