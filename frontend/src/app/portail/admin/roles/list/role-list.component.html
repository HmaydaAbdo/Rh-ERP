
<div class="role-list app-page">
  <div class="app-page__header">
    <h1>Rôles</h1>
    <div class="app-page__actions app-page__actions--liste">
      <button stp-button icon="plus" type="button" routerLink="/admin/roles/new">Nouveau rôle</button>
    </div>
  </div>

  <form [formRoot]="filterForm" class="app-toolbar" (submit)="onSearch()">
    <input class="stp-input" type="text" [formField]="filterForm.nom" aria-label="Nom" autocomplete="off" spellcheck="false" placeholder="Nom" />
    <input class="stp-input" type="text" [formField]="filterForm.description" aria-label="Description" autocomplete="off" placeholder="Description" />
    <button stp-button variant="text" icon="x" class="app-toolbar__clear" type="button" (click)="onResetFilters()">Réinitialiser</button>
  </form>

  <div class="app-table-bar">
    <p class="app-table-bar__total" role="status">
      @if (!loading()) {
        {{ totalRecords() }} rôle{{ totalRecords() > 1 ? 's' : '' }}
      }
    </p>
    <div class="app-table-bar__tools">
      <app-column-chooser class="en-ligne" [state]="columns"></app-column-chooser>
    </div>
  </div>

  <stp-table
    label="Liste : Rôles"
    emptyMessage="Aucun rôle ne correspond à ces critères."
    [lazy]="true"
    [value]="roles()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [columns]="columns.visible"
    [(first)]="first"
    (lazyLoad)="onLazyLoad($event)"
    (columnsReorder)="columns.onReorder($event)"
  >
    <ng-template stpCell let-role let-col="col">
      @switch (col.field) {
        @case ('nom') {
          {{ role.nom }}
        }
        @case ('description') {
          {{ role.description || '—' }}
        }
        @case ('permissions') {
          <stp-badge [value]="role.permissions.length + ' permission(s)'" severity="info"></stp-badge>
        }
      }
    </ng-template>

    <ng-template stpRowActions let-role>
      <button stp-button variant="text" icon="pencil" iconOnly type="button" [attr.aria-label]="'Modifier le rôle ' + role.nom" (click)="onEdit(role)"></button>
      <button stp-button variant="danger-text" icon="trash-2" iconOnly type="button" [loading]="deletingId() === role.id" [disabled]="role.protege" [title]="role.protege ? 'Rôle d’administration : non supprimable' : ''" [attr.aria-label]="'Supprimer le rôle ' + role.nom" (click)="onDelete(role)"></button>
    </ng-template>
  </stp-table>
</div>
