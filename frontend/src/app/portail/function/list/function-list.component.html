<div class="function-list app-page">
  <div class="app-table-bar">
    <p class="app-table-bar__total" role="status">
      @if (!loading()) {
        {{ totalRecords() }} fonction{{ totalRecords() > 1 ? 's' : '' }}
      }
    </p>
    <div class="app-table-bar__tools">
      <app-column-chooser class="en-ligne" [state]="columns"></app-column-chooser>
    </div>
  </div>

  <stp-table
    label="Liste des fonctions"
    emptyMessage="Aucune fonction ne correspond à ces critères."
    [lazy]="true"
    [value]="functions()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [columns]="columns.visible"
    (lazyLoad)="onLazyLoad($event)"
    (columnsReorder)="columns.onReorder($event)"
  >
    <ng-template stpCell let-fonction let-col="col">
      @switch (col.field) {
        @case ('libelle') {
          {{ fonction.libelle }}
        }
      }
    </ng-template>

    <ng-template stpRowActions let-fonction>
      <button stp-button variant="text" iconOnly icon="eye" type="button" [attr.aria-label]="'Voir la fonction ' + fonction.libelle" (click)="onView(fonction)"></button>
      @if (canWrite()) {
        <button stp-button variant="text" iconOnly icon="pencil" type="button" [attr.aria-label]="'Modifier la fonction ' + fonction.libelle" (click)="onEdit(fonction)"></button>
      }
      @if (canDelete()) {
        <button
          stp-button
          variant="danger-text"
          iconOnly
          icon="trash-2"
          type="button"
          [loading]="deletingId() === fonction.id"
          [attr.aria-label]="'Supprimer la fonction ' + fonction.libelle"
          (click)="onDelete(fonction)"
        ></button>
      }
    </ng-template>
  </stp-table>
</div>
