<div class="function-list">
  <app-collection-table
    [configuration]="tableConfiguration"
    [columnState]="columns"
    [value]="functions()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (lazyLoad)="onLazyLoad($event)"
  >
    <ng-template stpCell let-fonction let-col="col">
      @switch (col.field) {
        @case ('libelle') {
          {{ fonction.libelle }}
        }
      }
    </ng-template>

    <ng-template stpRowActions let-fonction>
      <button stp-button variant="text" iconOnly icon="eye" type="button" [attr.aria-label]="'Voir la fonction ' + fonction.libelle" (click)="onView(fonction)"></button>
      @if (canWrite()) {
        <button stp-button variant="text" iconOnly icon="pencil" type="button" [attr.aria-label]="'Modifier la fonction ' + fonction.libelle" (click)="onEdit(fonction)"></button>
      }
      @if (canDelete()) {
        <button
          stp-button
          variant="danger-text"
          iconOnly
          icon="trash-2"
          type="button"
          [loading]="deletingId() === fonction.id"
          [attr.aria-label]="'Supprimer la fonction ' + fonction.libelle"
          (click)="onDelete(fonction)"
        ></button>
      }
    </ng-template>
  </app-collection-table>
</div>
