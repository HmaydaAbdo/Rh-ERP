<div class="function-form">
  <div class="function-form__header">
    <h1>{{ isEditMode ? 'Modifier la fonction' : 'Nouvelle fonction' }}</h1>
    <a routerLink="/functions" class="p-button p-button-outlined">Retour à la liste</a>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="function-form__grid">
    <div class="field">
      <label for="libelle">Libellé *</label>
      <input pInputText id="libelle" type="text" formControlName="libelle" />
      @if (form.controls.libelle.invalid && form.controls.libelle.touched) {
        <small class="field-error">Le libellé est obligatoire.</small>
      }
    </div>

    <div class="function-form__actions">
      <button pButton type="submit" [label]="isEditMode ? 'Enregistrer' : 'Créer'" [loading]="saving" [disabled]="saving"></button>
    </div>
  </form>
</div>
