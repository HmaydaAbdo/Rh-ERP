<div class="function-form app-page app-page--narrow">
  <a routerLink="/functions" class="app-back"><stp-icon name="arrow-left" /> Fonctions</a>
  <div class="app-page__header">
    <h1>{{ isEditMode() ? 'Modifier la fonction' : 'Nouvelle fonction' }}</h1>
  </div>

  <form [formRoot]="form" class="app-form__grid">
    <div class="field">
      <label for="libelle">Libellé <span class="field__req" aria-hidden="true">*</span></label>
      <input class="stp-input" autocomplete="off" id="libelle" type="text" aria-describedby="libelle-aide" [formField]="form.libelle" />
      <small id="libelle-aide">Obligatoire · 100 caractères maximum · les espaces autour sont retirés. Chaque libellé doit être unique, sans distinguer majuscules et minuscules.</small>
      <stp-field-error [field]="form.libelle" />
    </div>

    <div class="app-form__actions">
      <a stp-button variant="text" routerLink="/functions">Annuler</a>
      <button stp-button type="submit" [loading]="form().submitting()">{{ isEditMode() ? 'Enregistrer' : 'Créer' }}</button>
    </div>
  </form>
</div>
