<div class="app-page__actions app-page__actions--liste">
  @if (canImport()) {
    <stp-split-button label="Importer" icon="upload" moreLabel="Autres actions d’import" [items]="menuImport" [disabled]="importing()" (clicked)="onTriggerImport()"></stp-split-button>
  }
  @if (canWrite()) {
    <a stp-button icon="plus" routerLink="/functions/new">Nouvelle fonction</a>
  }
</div>

<input #fileInput type="file" accept=".xlsx" class="hidden" (change)="onFileSelected($event)" />

<stp-dialog header="Résultat de l'import" width="520px" [(open)]="showImportResultDialog">
  @if (importResult(); as result) {
    <p>
      <strong>{{ result.totalLignes }}</strong> ligne(s) traitée(s) —
      <strong>{{ result.crees }}</strong> créée(s),
      <strong>{{ result.ignores }}</strong> ignorée(s).
    </p>

    @if (result.lignesIgnorees.length > 0) {
      <stp-table label="Lignes de fonctions ignorées à l’import" [value]="result.lignesIgnorees" [columns]="colonnesIgnorees" [paginated]="false" [reorderable]="false" [rowActionsVisible]="false" />
    }
  }
</stp-dialog>
