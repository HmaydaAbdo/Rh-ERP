@if (fonction(); as fonction) {
  <div class="function-detail app-page app-page--narrow">
    <a routerLink="/functions" class="app-back"><stp-icon name="arrow-left" /> Fonctions</a>
    <div class="app-page__header">
      <h1>{{ fonction.libelle }}</h1>
      <div class="app-page__actions">
        @if (canWrite()) {
          <a stp-button [routerLink]="['/functions', fonction.id, 'edit']">Modifier</a>
        }
      </div>
    </div>

    <dl class="app-detail">
      <div>
        <dt>Libellé</dt>
        <dd>{{ fonction.libelle }}</dd>
      </div>
    </dl>
  </div>
}
