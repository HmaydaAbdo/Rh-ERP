<div class="app-map-page app-page">
  <app-chantier-carte class="app-map-page__map" [chantiers]="chantiersFiltres()" />

  <form [formRoot]="formulaire" class="app-map-page__search" aria-label="Recherche sur la carte">
    <stp-icon class="app-map-page__search-icon" name="search" aria-hidden="true" />
    <input
      class="app-map-page__input"
      type="search"
      autocomplete="off"
      [formField]="formulaire.texte"
      aria-label="Rechercher par code ou nom de chantier"
      placeholder="Code ou nom…"
    />
    <span class="app-map-page__sep" aria-hidden="true"></span>
    <stp-select
      class="app-map-page__kind"
      ariaLabel="Filtrer par nature"
      [options]="natures"
      [multiple]="true"
      [value]="naturesChoisies()"
      placeholder="Nature"
      [summaryLabel]="'{0}'"
      [summaryFrom]="2"
      (valueChange)="choisirNatures($event)"
    />
  </form>

  @if (erreur()) {
    <button stp-button class="app-map-page__retry" type="button" (click)="charger()">Réessayer</button>
  }
  @if (!chargement() && !erreur() && chantiersFiltres().length === 0) {
    <p class="app-map-page__empty" role="status">Aucun chantier ne correspond à cette recherche.</p>
  }
  @if (chargement()) {
    <span class="app-lecteur" role="status">Chargement des chantiers…</span>
  }
</div>
