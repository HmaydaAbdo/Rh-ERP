@if (chantier) {
  <div class="chantier-detail app-page app-page--narrow">
    <a routerLink="/chantiers" class="app-back"><i class="pi pi-arrow-left" aria-hidden="true"></i> Chantiers</a>
    <div class="app-page__header">
      <h1>{{ chantier.code }}</h1>
      <div class="app-page__actions">
        @if (canWrite()) {
          <a [routerLink]="['/chantiers', chantier.id, 'edit']" class="p-button">Modifier</a>
        }
      </div>
    </div>

    <dl class="app-detail">
      <div>
        <dt>Désignation</dt>
        <dd>{{ chantier.designation }}</dd>
      </div>
      <div>
        <dt>Nom</dt>
        <dd>{{ chantier.nom || '-' }}</dd>
      </div>
      <div>
        <dt>Statut</dt>
        <dd>
          <p-tag [value]="chantier.actif ? 'Actif' : 'Inactif'" [severity]="chantier.actif ? 'success' : 'danger'"></p-tag>
        </dd>
      </div>
      <div>
        <dt>Source</dt>
        <dd>
          @if (chantier.sourceErp) {
            <p-tag value="ERP" severity="info"></p-tag>
          } @else {
            <p-tag value="Manuel" severity="secondary"></p-tag>
          }
        </dd>
      </div>
    </dl>
  </div>
}
