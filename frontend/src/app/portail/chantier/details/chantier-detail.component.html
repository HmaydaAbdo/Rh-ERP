@if (chantier(); as chantier) {
  <div class="chantier-detail app-page app-page--narrow">
    <a routerLink="/chantiers" class="app-back"><stp-icon name="arrow-left" /> Chantiers</a>
    <div class="app-page__header">
      <h1>{{ chantier.code }}</h1>
      <div class="app-page__actions">
        @if (canWrite()) {
          <button stp-button variant="secondary" [icon]="chantier.actif ? 'archive' : 'archive-restore'" type="button" [loading]="changement()" (click)="onChangerStatut(chantier)">{{ chantier.actif ? 'Clôturer' : 'Rouvrir' }}</button>
          <a stp-button [routerLink]="['/chantiers', chantier.id, 'edit']">Modifier</a>
        }
      </div>
    </div>

    <dl class="app-detail">
      <div>
        <dt>Désignation</dt>
        <dd>{{ chantier.designation }}</dd>
      </div>
      <div>
        <dt>Nom</dt>
        <dd>{{ chantier.nom || '-' }}</dd>
      </div>
      <div>
        <dt>Statut</dt>
        <dd>
          <stp-badge [value]="libelleStatut(chantier.actif)" [severity]="chantier.actif ? 'success' : 'neutral'"></stp-badge>
        </dd>
      </div>
      <div>
        <dt>Source</dt>
        <dd>
          @if (chantier.sourceErp) {
            <stp-badge value="ERP" severity="info"></stp-badge>
          } @else {
            <stp-badge value="Manuel" severity="neutral"></stp-badge>
          }
        </dd>
      </div>
    </dl>
  </div>
}
