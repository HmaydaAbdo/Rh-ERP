<div class="chantier-form app-page app-page--narrow">
  <a routerLink="/chantiers" class="app-back"><stp-icon name="arrow-left" /> Chantiers</a>
  <div class="app-page__header">
    <h1>{{ isEditMode() ? 'Modifier le chantier' : 'Nouveau chantier' }}</h1>
  </div>

  <form [formRoot]="form" class="app-form__grid">
    <div class="field">
      <label for="code">Code <span class="field__req" aria-hidden="true">*</span></label>
      <input class="stp-input" spellcheck="false" autocomplete="off" id="code" type="text" [formField]="form.code" />
      <stp-field-error [field]="form.code" />
    </div>

    <div class="field">
      <label for="designation">Désignation <span class="field__req" aria-hidden="true">*</span></label>
      <input class="stp-input" autocomplete="off" id="designation" type="text" [formField]="form.designation" />
      <stp-field-error [field]="form.designation" />
    </div>

    <div class="field">
      <label for="nom">Nom (optionnel)</label>
      <input class="stp-input" autocomplete="off" id="nom" type="text" [formField]="form.nom" />
      <small>Jamais synchronisé depuis l'ERP — affiché entre parenthèses après le code dans le rapport PDF et l'export Excel de la paie.</small>
      <stp-field-error [field]="form.nom" />
    </div>

    @if (isEditMode()) {
      <div class="field">
        <label for="actif">Statut <span class="field__req" aria-hidden="true">*</span></label>
        <stp-select ariaLabel="Statut" inputId="actif" [formField]="form.actif" [options]="actifOptions"></stp-select>
      </div>
    }

    <div class="app-form__actions">
      <a stp-button variant="text" routerLink="/chantiers">Annuler</a>
      <button stp-button type="submit" [loading]="form().submitting()">{{ isEditMode() ? 'Enregistrer' : 'Créer' }}</button>
    </div>
  </form>
</div>
