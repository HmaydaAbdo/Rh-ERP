<p-confirmDialog></p-confirmDialog>

<div class="equipe-list">
  <div class="equipe-list__header">
    <h1>Équipes</h1>
    @if (canWrite()) {
      <button pButton type="button" icon="pi pi-plus" label="Nouvelle équipe" routerLink="/equipes/new"></button>
    }
  </div>

  <form [formGroup]="filterForm" class="equipe-list__filters" (ngSubmit)="onSearch()">
    <input pInputText type="text" formControlName="code" placeholder="Code" />
    <input pInputText type="text" formControlName="libelle" placeholder="Libellé" />

    <button pButton type="submit" icon="pi pi-search" label="Rechercher"></button>
    <button pButton type="button" icon="pi pi-times" label="Réinitialiser" class="p-button-outlined" (click)="onResetFilters()"></button>
  </form>

  <p-table
    [value]="equipes"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [rowsPerPageOptions]="[10, 20, 50]"
    dataKey="id"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="code">Code <p-sortIcon field="code"></p-sortIcon></th>
        <th pSortableColumn="libelle">Libellé <p-sortIcon field="libelle"></p-sortIcon></th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-equipe>
      <tr>
        <td>{{ equipe.code }}</td>
        <td>{{ equipe.libelle }}</td>
        <td class="equipe-list__actions">
          <button pButton type="button" icon="pi pi-eye" class="p-button-text" (click)="onView(equipe)"></button>
          @if (canWrite()) {
            <button pButton type="button" icon="pi pi-pencil" class="p-button-text" (click)="onEdit(equipe)"></button>
          }
          @if (canDelete()) {
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              class="p-button-text p-button-danger"
              [loading]="deletingId === equipe.id"
              (click)="onDelete(equipe)"
            ></button>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">Aucune équipe ne correspond à ces critères.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
