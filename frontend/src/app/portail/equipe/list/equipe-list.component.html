
<div class="equipe-list app-page">
  <div class="app-table-bar">
    <p class="app-table-bar__total" role="status">
      @if (!loading()) {
        {{ totalRecords() }} équipe{{ totalRecords() > 1 ? 's' : '' }}
      }
    </p>
    <div class="app-table-bar__tools">
      <app-column-chooser class="en-ligne" [state]="columns"></app-column-chooser>
    </div>
  </div>

  <stp-table
    label="Liste : Équipes"
    emptyMessage="Aucune équipe ne correspond à ces critères."
    [lazy]="true"
    [value]="equipes()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [columns]="columns.visible"
    (lazyLoad)="onLazyLoad($event)"
    (columnsReorder)="columns.onReorder($event)"
  >
    <ng-template stpCell let-equipe let-col="col">
      @switch (col.field) {
        @case ('code') {
          {{ equipe.code }}
        }
        @case ('libelle') {
          {{ equipe.libelle }}
        }
      }
    </ng-template>

    <ng-template stpRowActions let-equipe>
      <button stp-button variant="text" icon="eye" iconOnly type="button" [attr.aria-label]="'Voir l’équipe ' + equipe.code" (click)="onView(equipe)"></button>
      @if (canWrite()) {
        <button stp-button variant="text" icon="pencil" iconOnly type="button" [attr.aria-label]="'Modifier l’équipe ' + equipe.code" (click)="onEdit(equipe)"></button>
      }
      @if (canDelete()) {
        <button stp-button variant="danger-text" icon="trash-2" iconOnly type="button" [loading]="deletingId() === equipe.id" [attr.aria-label]="'Supprimer l’équipe ' + equipe.code" (click)="onDelete(equipe)"></button>
      }
    </ng-template>
  </stp-table>
</div>
