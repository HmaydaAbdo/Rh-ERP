@if (equipe(); as equipe) {
  <div class="equipe-detail app-page app-page--narrow">
    <a routerLink="/equipes" class="app-back"><stp-icon name="arrow-left" /> Équipes</a>
    <div class="app-page__header">
      <h1>{{ equipe.libelle }}</h1>
      <div class="app-page__actions">
        @if (canWrite()) {
          <a stp-button [routerLink]="['/equipes', equipe.id, 'edit']">Modifier</a>
        }
      </div>
    </div>

    <dl class="app-detail">
      <div>
        <dt>Code</dt>
        <dd>{{ equipe.code }}</dd>
      </div>
      <div>
        <dt>Libellé</dt>
        <dd>{{ equipe.libelle }}</dd>
      </div>
    </dl>
  </div>
}
