<div class="app-page__actions app-page__actions--liste">
  @if (canImport()) {
    <stp-split-button label="Importer" icon="upload" moreLabel="Autres actions d’import" [items]="menuImport" [disabled]="importing()" (clicked)="choisirFichier()"></stp-split-button>
  }
  @if (canWrite()) {
    <a stp-button icon="plus" routerLink="/equipes/new">Nouvelle équipe</a>
  }
</div>
<input #fileInput type="file" accept=".xlsx" class="hidden" (change)="fichierSelectionne($event)" />
<stp-dialog header="Résultat de l'import" width="560px" [(open)]="resultOpen">
  @if (result(); as rapport) {
    <p><strong>{{ rapport.totalLignes }}</strong> ligne(s) traitée(s) — <strong>{{ rapport.crees }}</strong> créée(s), <strong>{{ rapport.ignores }}</strong> rejetée(s).</p>
    @if (rapport.lignesIgnorees.length > 0) {
      <stp-table label="Lignes d’équipes rejetées à l’import" [value]="rapport.lignesIgnorees" [columns]="colonnesIgnorees" [paginated]="false" [reorderable]="false" [rowActionsVisible]="false" />
    }
  }
</stp-dialog>
