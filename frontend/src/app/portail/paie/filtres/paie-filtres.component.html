<form [formRoot]="formulaire" class="paie-filtres" aria-label="Filtres de la paie">
  <div class="paie-filtres__periode" role="group" aria-label="Mois">
    <button stp-button variant="text" icon="chevron-left" iconOnly type="button" aria-label="Mois plus ancien" [disabled]="!plusAncien()" (click)="choisir(plusAncien())"></button>
    <button
      stp-button
      variant="text"
      icon="calendar"
      class="paie-filtres__mois"
      type="button"
      cdkOverlayOrigin
      #origine="cdkOverlayOrigin"
      aria-label="Choisir le mois"
      aria-haspopup="dialog"
      [attr.aria-expanded]="panneauMoisOuvert()"
      (click)="panneauMoisOuvert.set(!panneauMoisOuvert())"
    >
      <span class="paie-filtres__capitale">{{ libelle() }}</span>
    </button>
    <button stp-button variant="text" icon="chevron-right" iconOnly type="button" aria-label="Mois plus récent" [disabled]="!plusRecent()" (click)="choisir(plusRecent())"></button>
    @if (periode() && !moisObligatoire()) {
      <button stp-button variant="text" icon="x" iconOnly type="button" aria-label="Tous les mois" title="Tous les mois" (click)="choisir(null)"></button>
    }
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origine"
      [cdkConnectedOverlayOpen]="panneauMoisOuvert()"
      [cdkConnectedOverlayPositions]="positions"
      (overlayOutsideClick)="panneauMoisOuvert.set(false)"
      (overlayKeydown)="surToucheMois($event)"
      (detach)="panneauMoisOuvert.set(false)"
    >
      <div class="stp-popover" role="dialog" aria-label="Choisir un mois">
        <app-month-picker [value]="periode()" [disponibles]="disponibles()" (valueChange)="choisir($event); panneauMoisOuvert.set(false)"></app-month-picker>
      </div>
    </ng-template>
  </div>

  <span class="paie-filtres__champ">
    <stp-icon name="search" />
    <input class="stp-input" type="text" [formField]="formulaire.nomPrenom" placeholder="Nom &amp; prénom" aria-label="Nom et prénom" />
  </span>
  <button
    stp-button
    variant="secondary"
    type="button"
    class="paie-filtres__bascule"
    aria-controls="paie-filtres-secondaires"
    [attr.aria-expanded]="secondairesOuverts()"
    (click)="basculerSecondaires()"
  >
    Filtres
    @if (nombreSecondaires() > 0) {
      <span class="paie-filtres__badge">{{ nombreSecondaires() }}</span>
    }
    <stp-icon [name]="secondairesOuverts() ? 'chevron-up' : 'chevron-down'" />
  </button>

  <div id="paie-filtres-secondaires" class="paie-filtres__secondaires" [class.paie-filtres__secondaires--ouvert]="secondairesOuverts()">
    <input type="text" [formField]="formulaire.cin" class="stp-input paie-filtres__cin" placeholder="CIN" aria-label="CIN" />

    @if (peutChoisirChantiers()) {
      @for (source of sourcesChantiers(); track source) {
        <app-lazy-select
          class="paie-filtres__selecteur"
          [formField]="formulaire.chantierIds"
          [multiple]="true"
          [bulkFilterActions]="true"
          [source]="source"
          optionLabel="code"
          placeholder="Chantiers"
          ariaLabel="Chantiers"
          summaryLabel="{0} chantiers"
          [attr.title]="periode() ? 'Chantiers qui ont de la paie en ' + libelle() : null"
        ></app-lazy-select>
      }
    }
    @if (peutChoisirEquipes()) {
      @for (source of sourcesEquipes(); track source) {
        <app-lazy-select
          class="paie-filtres__selecteur"
          [formField]="formulaire.equipeIds"
          [multiple]="true"
          [bulkFilterActions]="true"
          [source]="source"
          optionLabel="libelle"
          placeholder="Équipes"
          ariaLabel="Équipes"
          summaryLabel="{0} groupes"
          [attr.title]="periode() && courant().chantierIds.length > 0 ? 'Équipes des chantiers choisis en ' + libelle() : null"
        ></app-lazy-select>
      }
    }
    @if (peutChoisirFonctions()) {
      <app-lazy-select
        class="paie-filtres__selecteur"
        [formField]="formulaire.fonctionIds"
        [multiple]="true"
        [bulkFilterActions]="true"
        [source]="functionReferenceService"
        optionLabel="libelle"
        placeholder="Fonctions"
        ariaLabel="Fonctions"
        summaryLabel="{0} fonctions"
      ></app-lazy-select>
    }
  </div>

  <button stp-button variant="text" icon="x" class="paie-filtres__effacer" type="button" aria-label="Effacer les filtres" [disabled]="!aDesFiltres()" (click)="reinitialiser()"><span class="paie-filtres__effacer-libelle">Effacer</span></button>
</form>
