<div class="app-page__actions app-page__actions--liste">
  @if (canExport()) {
    <button stp-button variant="secondary" icon="download" type="button" (click)="showExportDialog.set(true)">Exporter</button>
  }
  @if (canImport()) {
    <stp-split-button label="Importer" icon="upload" moreLabel="Autres actions d’import" [items]="menuImport" (clicked)="showImportDialog.set(true)"></stp-split-button>
  }
  @if (canWrite()) {
    <button stp-button icon="plus" type="button" routerLink="/paie/new">Nouveau bulletin</button>
  }
</div>

<app-paie-import-wizard [(visible)]="showImportDialog" [periodes]="periodes()" (importe)="importe.emit()"></app-paie-import-wizard>

<app-paie-export-wizard [(visible)]="showExportDialog"></app-paie-export-wizard>
