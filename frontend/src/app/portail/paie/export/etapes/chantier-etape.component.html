<section class="export-wizard__panneau" [class.export-wizard__panneau--arriere]="store.sens() === 'arriere'">
  <p class="export-wizard__consigne">Limitez le rapport à un seul chantier, ou gardez tous les chantiers.</p>
  <input
    type="search"
    class="export-wizard__recherche"
    placeholder="Rechercher un chantier"
    aria-label="Rechercher un chantier"
    [value]="store.rechercheChantier()"
    (input)="store.rechercherChantier($any($event.target).value)"
  />
  @if (store.chantiersEnCours()) {
    <p class="export-wizard__legende">Chargement des chantiers…</p>
  }
  <div class="export-wizard__choix" role="radiogroup" aria-label="Chantier du rapport">
    <label class="export-wizard__choix-item" [class.export-wizard__choix-item--choisi]="store.chantierChoisi() === null">
      <input type="radio" name="chantier" [checked]="store.chantierChoisi() === null" (change)="store.choisirChantier(null)" />
      <span>
        <span class="export-wizard__code">Tous les chantiers</span>
        <span class="export-wizard__meta">Rapport complet : un chapitre par chantier</span>
      </span>
    </label>
    @for (c of store.chantiersProposes(); track c.code) {
      <label class="export-wizard__choix-item" [class.export-wizard__choix-item--choisi]="store.chantierChoisi() === c.code">
        <input type="radio" name="chantier" [checked]="store.chantierChoisi() === c.code" (change)="store.choisirChantier(c.code)" />
        <span>
          <span class="export-wizard__code">{{ c.code }}</span>
          <span class="export-wizard__meta">{{ c.libelle ? c.libelle + ' · ' : '' }}{{ c.effectif }} employés</span>
        </span>
      </label>
    } @empty {
      @if (!store.chantiersEnCours()) {
        <p class="export-wizard__legende">Aucun chantier ne correspond à cette recherche.</p>
      }
    }
  </div>
  <label class="export-wizard__option">
    <input type="checkbox" class="stp-checkbox" [checked]="store.sansVueEnsemble()" (change)="store.basculerVueEnsemble()" />
    <span>
      Sans vue d'ensemble
      <small>Retire le chapitre I (indicateurs globaux et répartition par chantier) : le rapport commence par le premier chantier.</small>
    </span>
  </label>
</section>
