<div class="paie-form app-page app-page--wide">
  <a routerLink="/paie" class="app-back"><stp-icon name="arrow-left" /> Paie</a>
  <div class="app-page__header">
    <h1>{{ isEditMode() ? 'Modifier le bulletin' : 'Nouveau bulletin de paie' }}</h1>
  </div>

  @if (isEditMode()) {
    <stp-message severity="info" text="L'employé et la période ne sont pas modifiables après création — un bulletin est un document historique." class="paie-form__notice"></stp-message>
  }

  <form [formRoot]="form" class="app-form__grid app-form__grid--3">
    <div class="app-form__section"><h2>Affectation</h2></div>

    <div class="field">
      <label for="employeeId">Employé <span class="field__req" aria-hidden="true">*</span></label>
      <app-lazy-select
        ariaLabel="Employé" inputId="employeeId"
        [formField]="form.employeeId"
        [source]="employeeReferenceService"
        optionLabel="displayLabel"
        placeholder="Rechercher par nom"
      ></app-lazy-select>
      <stp-field-error [field]="form.employeeId" />
    </div>

    <div class="field">
      <label for="periode">Période <span class="field__req" aria-hidden="true">*</span></label>
      <stp-month-input inputId="periode" [formField]="form.periode" />
      <stp-field-error [field]="form.periode" />
    </div>

    <div class="field">
      <label for="fonctionId">Fonction <span class="field__req" aria-hidden="true">*</span></label>
      <app-lazy-select
        ariaLabel="Fonction" inputId="fonctionId"
        [formField]="form.fonctionId"
        [source]="functionReferenceService"
        optionLabel="libelle"
        placeholder="Sélectionner une fonction"
      ></app-lazy-select>
      <stp-field-error [field]="form.fonctionId" />
    </div>

    <div class="field">
      <label for="chantierId">Chantier <span class="field__req" aria-hidden="true">*</span></label>
      <app-lazy-select
        ariaLabel="Chantier" inputId="chantierId"
        [formField]="form.chantierId"
        [source]="chantierReferenceService"
        optionLabel="code"
        placeholder="Sélectionner un chantier"
      ></app-lazy-select>
      <stp-field-error [field]="form.chantierId" />
    </div>

    <div class="field">
      <label for="equipeId">Équipe</label>
      <app-lazy-select
        ariaLabel="Équipe" inputId="equipeId"
        [formField]="form.equipeId"
        [source]="equipeReferenceService"
        optionLabel="libelle"
        placeholder="Sélectionner une équipe"
      ></app-lazy-select>
    </div>

    <div class="app-form__section"><h2>Jours</h2></div>

    <div class="field">
      <label for="nombreJoursTravailles">Jours travaillés <span class="field__req" aria-hidden="true">*</span></label>
      <stp-number-input inputId="nombreJoursTravailles" [formField]="form.nombreJoursTravailles" [maxFractionDigits]="2" />
      <stp-field-error [field]="form.nombreJoursTravailles" />
    </div>

    <div class="field">
      <label for="joursRecuperationOuvrable">Jours récup. ouvrable</label>
      <stp-number-input inputId="joursRecuperationOuvrable" [formField]="form.joursRecuperationOuvrable" [maxFractionDigits]="2" />
    </div>

    <div class="field">
      <label for="joursRecuperationDimanche">Jours récup. dimanche</label>
      <stp-number-input inputId="joursRecuperationDimanche" [formField]="form.joursRecuperationDimanche" [maxFractionDigits]="2" />
    </div>

    <div class="app-form__section"><h2>Rémunération</h2></div>

    <div class="field">
      <label for="salaireMensuel">Salaire mensuel <span class="field__req" aria-hidden="true">*</span></label>
      <stp-number-input inputId="salaireMensuel" [formField]="form.salaireMensuel" [minFractionDigits]="2" />
      <stp-field-error [field]="form.salaireMensuel" />
    </div>

    <div class="field">
      <label for="primeRoulageOrdinaire">Prime roulage ordinaire</label>
      <stp-number-input inputId="primeRoulageOrdinaire" [formField]="form.primeRoulageOrdinaire" [minFractionDigits]="2" />
    </div>

    <div class="field">
      <label for="primeRoulageDimanche">Prime roulage dimanche</label>
      <stp-number-input inputId="primeRoulageDimanche" [formField]="form.primeRoulageDimanche" [minFractionDigits]="2" />
    </div>

    <div class="field">
      <label for="salaireTotal">Salaire total <span class="field__req" aria-hidden="true">*</span></label>
      <stp-number-input inputId="salaireTotal" [formField]="form.salaireTotal" [minFractionDigits]="2" />
      <stp-field-error [field]="form.salaireTotal" />
    </div>

    <div class="field app-form__wide">
      <label for="observation">Observation</label>
      <input class="stp-input" autocomplete="off" id="observation" type="text" [formField]="form.observation" />
    </div>

    <div class="app-form__actions">
      <a stp-button variant="text" routerLink="/paie">Annuler</a>
      <button stp-button type="submit" [loading]="form().submitting()">{{ isEditMode() ? 'Enregistrer' : 'Créer' }}</button>
    </div>
  </form>
</div>
