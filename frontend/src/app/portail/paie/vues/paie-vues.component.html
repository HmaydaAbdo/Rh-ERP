<div class="app-vues">
  <div class="app-vues__header">
    <h1>Paie</h1>
    <app-vue-switcher label="Vue de la paie" [vues]="vues"></app-vue-switcher>
    <app-paie-actions class="app-vues__actions" [periodes]="periodes()" (importe)="rafraichirVue()"></app-paie-actions>
  </div>

  <app-paie-filtres
    [periodes]="periodes()"
    [value]="filtres()"
    [moisRequis]="moisRequis()"
    [avecFil]="cartes()"
    (valueChange)="appliquer($event)"
  ></app-paie-filtres>

  @if (vueAffichee()) {
    <router-outlet (activate)="surActivation()"></router-outlet>
  }
</div>
