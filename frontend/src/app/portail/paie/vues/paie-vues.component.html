<app-collection-shell
  [configuration]="configuration"
  [contentVisible]="vueAffichee()"
  (outletActivated)="surActivation()"
>
  <app-paie-actions collection-actions [periodes]="periodes()" (importe)="rafraichirVue()"></app-paie-actions>
  <app-paie-filtres
    collection-filters
    [periodes]="periodes()"
    [value]="filtres()"
    [moisRequis]="moisRequis()"
    (valueChange)="appliquer($event)"
  ></app-paie-filtres>
</app-collection-shell>
