<div class="paie-vues">
  <div class="paie-vues__header">
    <h1>Paie</h1>
    <app-paie-vue-switcher></app-paie-vue-switcher>
    <app-paie-actions class="paie-vues__actions" (importe)="rafraichirVue()"></app-paie-actions>
  </div>

  <app-paie-filtres
    [periodes]="periodes()"
    [value]="filtres()"
    [moisRequis]="moisRequis()"
    [avecFil]="cartes()"
    (valueChange)="appliquer($event)"
  ></app-paie-filtres>

  @if (vueAffichee()) {
    <router-outlet (activate)="surActivation()"></router-outlet>
  }
</div>
