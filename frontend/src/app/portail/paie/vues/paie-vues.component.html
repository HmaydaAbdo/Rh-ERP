<div class="paie-vues">
  <div class="paie-vues__header">
    <h1>Paie</h1>
    <app-paie-vue-switcher></app-paie-vue-switcher>
  </div>

  <app-paie-filtres
    [periodes]="periodes()"
    [value]="filtres()"
    [vue]="mode()"
    [moisRequis]="moisRequis()"
    (valueChange)="appliquer($event)"
  ></app-paie-filtres>

  @if (annonce(); as phrase) {
    <p class="paie-vues__annonce" role="status">
      <i class="pi pi-info-circle" aria-hidden="true"></i> {{ phrase }}
    </p>
  }

  <router-outlet (activate)="surActivation()"></router-outlet>
</div>
