<p-toast></p-toast>
<p-confirmDialog key="sortie"></p-confirmDialog>

@if (isAuthenticated()) {
  <a class="app-skip" href="#contenu" (click)="allerAuContenu($event)">Aller au contenu</a>
  <div class="app-shell" [class.app-shell--menu-ouvert]="menuOuvert()" (keydown.escape)="fermerMenu()">
    <header class="app-topbar">
      <button
        type="button"
        class="app-topbar__menu"
        aria-controls="menu-principal"
        [attr.aria-expanded]="menuOuvert()"
        [attr.aria-label]="menuOuvert() ? 'Fermer le menu' : 'Ouvrir le menu'"
        (click)="basculerMenu()"
      >
        <i class="pi" [class.pi-bars]="!menuOuvert()" [class.pi-times]="menuOuvert()" aria-hidden="true"></i>
      </button>
      <img class="app-topbar__logo" src="assets/brand/monogramme.svg" alt="" width="28" height="28" />
      <span class="app-topbar__titre" translate="no">{{ title }}</span>
    </header>
    <div class="app-backdrop" (click)="fermerMenu()" aria-hidden="true"></div>

    <aside id="menu-principal" class="app-sidebar">
      <div class="app-sidebar__brand">
        <img class="app-sidebar__logo" src="assets/brand/monogramme.svg" alt="" width="36" height="36" />
        <span class="app-sidebar__label" translate="no">{{ title }}</span>
      </div>
      <nav class="app-sidebar__nav" aria-label="Navigation principale">
        @for (item of navItems(); track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="app-sidebar__link"
            (click)="fermerMenu()"
            pTooltip="{{ item.label }}"
            tooltipPosition="right"
            [showDelay]="300"
          >
            <i [class]="item.icon" aria-hidden="true"></i>
            <span class="app-sidebar__label">{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="app-sidebar__footer">
        @if (user(); as u) {
          <span class="app-sidebar__label app-sidebar__username">{{ u.username }}</span>
        }
        <button
          type="button"
          class="app-sidebar__action"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'"
          [pTooltip]="theme.theme() === 'dark' ? 'Thème clair' : 'Thème sombre'"
          tooltipPosition="right"
          (click)="theme.basculer()"
        >
          <i class="pi" [class.pi-moon]="theme.theme() === 'light'" [class.pi-sun]="theme.theme() === 'dark'" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="app-sidebar__action"
          aria-label="Se déconnecter"
          pTooltip="Se déconnecter"
          tooltipPosition="right"
          (click)="onLogout()"
        >
          <i class="pi pi-sign-out" aria-hidden="true"></i>
        </button>
      </div>
    </aside>

    <main id="contenu" class="app-content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
