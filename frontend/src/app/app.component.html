<app-feedback-viewport />

<stp-app-shell
  [items]="menu()"
  [groupes]="groupes"
  [utilisateur]="user()?.username ?? null"
  [theme]="theme.theme()"
  [navigationVisible]="navigationVisible()"
  [assistantDisponible]="assistantVisible()"
  [assistantOuvert]="assistantEtat.ouvert()"
  (basculerTheme)="theme.basculer()"
  (modeAssistant)="assistantEtat.ouvert.set($event)"
  (deconnecter)="onLogout()"
>
  <router-outlet></router-outlet>
</stp-app-shell>

@if (assistantVisible()) {
  <!-- Chargé après l'écran (client AG-UI compris) : le premier affichage ne paie pas l'assistant. -->
  @defer (on idle) {
    <app-assistant />
  }
}
