<p-toast></p-toast>

@if (isAuthenticated()) {
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <img class="app-sidebar__logo" src="assets/brand/monogramme.svg" alt="" width="36" height="36" />
        <span class="app-sidebar__label">{{ title }}</span>
      </div>
      <nav class="app-sidebar__nav" aria-label="Navigation principale">
        @for (item of navItems(); track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="app-sidebar__link"
            pTooltip="{{ item.label }}"
            tooltipPosition="right"
            [showDelay]="300"
          >
            <i [class]="item.icon" aria-hidden="true"></i>
            <span class="app-sidebar__label">{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="app-sidebar__footer">
        @if (user(); as u) {
          <span class="app-sidebar__label app-sidebar__username">{{ u.username }}</span>
        }
        <button
          type="button"
          class="app-sidebar__action"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'"
          [pTooltip]="theme.theme() === 'dark' ? 'Thème clair' : 'Thème sombre'"
          tooltipPosition="right"
          (click)="theme.basculer()"
        >
          <i class="pi" [class.pi-moon]="theme.theme() === 'light'" [class.pi-sun]="theme.theme() === 'dark'" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="app-sidebar__action"
          aria-label="Se déconnecter"
          pTooltip="Se déconnecter"
          tooltipPosition="right"
          (click)="onLogout()"
        >
          <i class="pi pi-sign-out" aria-hidden="true"></i>
        </button>
      </div>
    </aside>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
