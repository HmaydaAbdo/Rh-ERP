<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Staport RH</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052a49">
  <link rel="icon" type="image/svg+xml" href="assets/brand/monogramme.svg">
  <script>
    // Pose le thème avant le premier affichage (pas de flash clair puis sombre) : le choix mémorisé, sinon la préférence du système.
    // Même règle que core/theme/theme.service.ts.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('staport-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
