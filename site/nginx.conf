# nginx inner du site de documentation. L'authentification est posée par nginx outer (voir site/docs/exploitation) :
# ce conteneur n'est jamais exposé directement (lié à 127.0.0.1 par docker-compose.yml).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  # Interdit l'indexation et l'affichage dans un cadre tiers.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
