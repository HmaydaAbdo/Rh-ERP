<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Rapport de paie — Par chantier et équipe</title>
    <style th:utext="${css}"></style>
    <style>@page { size: A4 landscape; }</style>
</head>
<body>

<table th:replace="~{fragments :: hero('Détail par chantier et équipe')}"></table>

<!-- Un chantier commence toujours en haut d'une nouvelle page (sauf le premier, déjà en haut de page). -->
<div th:each="chantier, iterChantier : ${chantiers}"
     th:style="${iterChantier.first} ? '' : 'page-break-before: always;'">

    <div th:replace="~{fragments :: section(${chantier.titre}, 'chantier', ${chantier.lignes}, ${chantier.totaux}, ${chantier.effectifParFonction})}"></div>

    <div th:each="equipe : ${chantier.equipes}"
         th:replace="~{fragments :: section(${equipe.titre}, 'equipe', ${equipe.lignes}, ${equipe.totaux}, ${equipe.effectifParFonction})}"></div>

</div>

</body>
</html>
