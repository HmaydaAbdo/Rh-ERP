<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Rapport de paie — Détail par chantier</title>
    <style th:utext="${css}"></style>
    <style>@page { size: A4 landscape; }</style>
</head>
<body>

<table th:replace="~{fragments :: hero('Détail par chantier')}"></table>

<div th:replace="~{fragments :: section(${glb}, true)}"></div>

<th:block th:each="chantier : ${chantiers}">
    <div th:replace="~{fragments :: section(${chantier}, false)}"></div>
    <th:block th:each="equipe : ${chantier.sousSections}">
        <div th:replace="~{fragments :: section(${equipe}, false)}"></div>
    </th:block>
</th:block>

</body>
</html>
