spring:
  application:
    name: paie

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Le schéma est géré par Flyway (voir src/main/resources/db/migration), jamais par Hibernate :
      # validate compare les entités au schéma réel et échoue au démarrage en cas d'écart, sans
      # jamais modifier la base lui-même (conventions/database.md).
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    web:
      pageable:
        max-page-size: 200

chantier:
  sync:
    base-url: ${CHANTIER_SYNC_BASE_URL}
    cron: "0 0 23 * * *"