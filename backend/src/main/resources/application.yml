spring:
  application:
    name: paie

  ai:
    mcp:
      server:
        # Serveur MCP de Spring AI (docs/ia.md, T13) : sans état, sur /mcp, uniquement des outils (@McpTool).
        enabled: ${security.mcp.enabled}
        name: erp-rh
        version: "1"
        type: SYNC
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        instructions: >
          Outils de lecture d'ERP-RH, une entreprise du BTP au Maroc : employés, paie, chantiers, équipes, fonctions,
          paramètres et journal d'audit. Chaque outil est limité par les droits de l'utilisateur. Chercher d'abord
          l'identifiant d'un chantier, d'une équipe ou d'une fonction avec l'outil de recherche du même domaine.

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Le schéma est géré par Flyway (voir src/main/resources/db/migration), jamais par Hibernate :
      # validate compare les entités au schéma réel et échoue au démarrage en cas d'écart, sans
      # jamais modifier la base lui-même (conventions/database.md).
      ddl-auto: validate
    # Ni les requêtes SQL dans les logs (bruit et coût en production ; le développement les allume avec
    # SPRING_JPA_SHOW_SQL=true), ni de session JPA ouverte pendant tout le rendu de la réponse (conventions/jpa.md) :
    # une association paresseuse se charge dans la transaction du service, jamais après.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      # Envers (conventions/audit.md) : une table <table>_aud par entité auditée, écrite par insertion seulement
      # (stratégie par défaut — la stratégie « validity » met à jour l'historique, incompatible avec un audit
      # que l'application ne peut pas réécrire). store_data_at_delete : le contenu d'une ligne supprimée est
      # conservé (comparaison avant/après et restauration), pas seulement son identifiant.
      org.hibernate.envers.audit_table_suffix: _aud
      org.hibernate.envers.revision_field_name: rev
      org.hibernate.envers.revision_type_field_name: revtype
      org.hibernate.envers.store_data_at_delete: true
      org.hibernate.envers.do_not_audit_optimistic_locking_field: true
      # Écritures regroupées : un import ou une suppression de ~1 000 lignes écrit autant de lignes d'audit,
      # envoyées par lots plutôt qu'une par une.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway s'exécute avec le compte PROPRIÉTAIRE du schéma ; l'application, avec un compte applicatif distinct qui n'a
    # que SELECT et INSERT sur les tables d'audit (conventions/deployment.md, « Deux comptes PostgreSQL »). Le rappel
    # afterMigrate.sql crée ce compte et recalcule ses droits : il reçoit son nom et son mot de passe ici.
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      app_user: ${DB_USER}
      app_password: ${DB_PASSWORD}
      pgaudit_enabled: ${PGAUDIT_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    web:
      pageable:
        max-page-size: 200

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH}
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          starttls:
            enable: ${SMTP_STARTTLS}

staport:
  auth:
    mail:
      executor:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        keep-alive: 30s
        await-termination: 30s

# Documentation d'API (conventions/swagger.md) : ÉTEINTE par défaut, donc en production — la liste de toutes les routes
# n'a pas à être lisible sans connexion. Le développement l'allume avec les variables d'environnement
# SPRINGDOC_API_DOCS_ENABLED=true et SPRINGDOC_SWAGGER_UI_ENABLED=true (backend/.env.example).
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

server:
  # Le backend n'est joignable que par nginx (réseau Docker interne) : l'adresse du client réel, enregistrée par
  # l'audit (conventions/audit.md), vient de X-Forwarded-For, honoré seulement de proxys internes de confiance
  # (conventions/deployment.md, « Adresse IP du client »).
  forward-headers-strategy: native

logging:
  # text (défaut) ou json (production). Dans les deux cas, les événements vont en console et dans
  # des archives journalières gardées 30 jours. Voir logback-spring.xml.
  format: ${LOGGING_FORMAT:text}
  file:
    path: ${LOGGING_FILE_PATH:logs}
  pattern:
    # Seul l'identifiant de corrélation est ajouté aux logs ; l'identité de l'acteur reste dans l'audit à accès contrôlé.
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        # Santé (HEALTHCHECK Docker) et métriques pour le scraping Prometheus : les deux sont publics (aucune donnée sensible,
        # conventions/security.md) mais ne sont joignables que depuis le serveur — nginx inner ne relaie que /actuator/health.
        # Tout autre endpoint de supervision reste non exposé.
        include: health,prometheus
  metrics:
    tags:
      # Distingue cette application dans un Prometheus partagé.
      application: ${spring.application.name}
  health:
    # Sans ceci, /actuator/health (utilisé par le HEALTHCHECK Docker et depends_on:
    # condition: service_healthy — voir docker-compose.yml) passe à DOWN dès que le serveur SMTP
    # est injoignable, alors que l'application elle-même reste parfaitement fonctionnelle : une
    # panne SMTP temporaire n'a aucune raison de sortir tout le backend de la rotation.
    mail:
      enabled: false
  # Traces OpenTelemetry (docs/ia.md, T18) : coupées par défaut (tests, ng serve) ; Compose les active
  # (MANAGEMENT_TRACING_ENABLED, MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT) vers Phoenix. Toutes les requêtes
  # sont tracées : le volume reste celui d'une application interne. Métriques et journaux restent sur Prometheus et la sortie
  # standard : aucun export OTLP pour eux.
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

chantier:
  sync:
    base-url: ${CHANTIER_SYNC_BASE_URL}
    # Bornes de l'adaptateur ERP : aucune connexion ou lecture ne peut bloquer la tâche indéfiniment.
    # Une erreur est propagée sans retry automatique ; la prochaine exécution reprend l'export complet.
    connect-timeout: 5s
    read-timeout: 30s
    # La planification quotidienne n'est pas ici : c'est le paramètre « Planification de la synchronisation des chantiers »
    # (écran Paramètres, conventions/configuration.md).

security:
  jwt:
    # Secret HMAC (HS256) pour signer/valider les Access Tokens, base64, 256 bits minimum. Jamais de
    # valeur par défaut (conventions/security.md) — générer avec, par ex., `openssl rand -base64 32`.
    secret: ${JWT_SECRET}
  mcp:
    # Route /mcp et jeton délégué de l'agent IA (docs/ia.md, § 5). Obligatoire : true ou false, jamais deviné.
    enabled: ${MCP_ENABLED}
    # Avec MCP_ENABLED=true, le démarrage échoue sans clé privée RSA 3072 bits (base64 d'un PKCS#8 DER) ni identifiant.
    # La clé publique précédente (base64 d'un X.509 DER) reste acceptée pendant un changement de clé.
    private-key: ${MCP_JWT_PRIVATE_KEY:}
    key-id: ${MCP_JWT_KEY_ID:}
    previous-public-key: ${MCP_JWT_PREVIOUS_PUBLIC_KEY:}
    previous-key-id: ${MCP_JWT_PREVIOUS_KEY_ID:}
  cors:
    frontend-url: ${FRONTEND_URL}
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    # true en toute configuration servie en HTTPS ; peut être mis à false uniquement pour un accès
    # direct au backend en HTTP pur (hors du proxy de dev Angular, qui rend déjà tout same-origin).
    secure: ${COOKIE_SECURE}
  admin:
    # Compte SYSTEM_ADMIN de bootstrap, créé au démarrage s'il n'existe pas encore (voir
    # AdminBootstrapRunner / conventions/security.md).
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  mail:
    # Adresse "From" des emails envoyés (mot de passe oublié) — distincte de spring.mail.username
    # (identifiant SMTP, vide quand le serveur ne requiert pas d'authentification, ex. Mailpit).
    from: ${MAIL_FROM}
