spring:
  application:
    name: paie

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Le schéma est géré par Flyway (voir src/main/resources/db/migration), jamais par Hibernate :
      # validate compare les entités au schéma réel et échoue au démarrage en cas d'écart, sans
      # jamais modifier la base lui-même (conventions/database.md).
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    web:
      pageable:
        max-page-size: 200

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH}
          starttls:
            enable: ${SMTP_STARTTLS}

management:
  health:
    # Sans ceci, /actuator/health (utilisé par le HEALTHCHECK Docker et depends_on:
    # condition: service_healthy — voir docker-compose.yml) passe à DOWN dès que le serveur SMTP
    # est injoignable, alors que l'application elle-même reste parfaitement fonctionnelle : une
    # panne SMTP temporaire n'a aucune raison de sortir tout le backend de la rotation.
    mail:
      enabled: false

chantier:
  sync:
    base-url: ${CHANTIER_SYNC_BASE_URL}
    cron: "0 0 23 * * *"

security:
  jwt:
    # Secret HMAC (HS256) pour signer/valider les Access Tokens, base64, 256 bits minimum. Jamais de
    # valeur par défaut (conventions/security.md) — générer avec, par ex., `openssl rand -base64 32`.
    secret: ${JWT_SECRET}
  cors:
    frontend-url: ${FRONTEND_URL}
  cookie:
    # true en toute configuration servie en HTTPS ; peut être mis à false uniquement pour un accès
    # direct au backend en HTTP pur (hors du proxy de dev Angular, qui rend déjà tout same-origin).
    secure: ${COOKIE_SECURE}
  admin:
    # Compte SYSTEM_ADMIN de bootstrap, créé au démarrage s'il n'existe pas encore (voir
    # AdminBootstrapRunner / conventions/security.md).
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  mail:
    # Adresse "From" des emails envoyés (mot de passe oublié) — distincte de spring.mail.username
    # (identifiant SMTP, vide quand le serveur ne requiert pas d'authentification, ex. Mailpit).
    from: ${MAIL_FROM}