# Enregistre les polices embarquées du rapport PDF de paie (voir report/paie/fonts/) auprès de
# JasperReports — fichier découvert automatiquement au démarrage (convention JasperReports : tout
# fichier nommé exactement "jasperreports_extension.properties" trouvé sur le classpath est fusionné,
# aucun câblage Java requis). Rend la police "Liberation Serif" disponible indépendamment de ce qui
# est installé au niveau du système d'exploitation qui exécute le backend (voir
# report/paie/fonts/liberation-serif-fonts.xml et docs/report/README.md, section « Style visuel »).
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.staport-liberation-serif=report/paie/fonts/liberation-serif-fonts.xml
