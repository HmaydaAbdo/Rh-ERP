[project]
name = "erp-rh-ia"
version = "0.1.0"
description = "Service IA d'ERP-RH : graphe LangGraph, client MCP vers Spring, AG-UI vers Angular, modèles via LiteLLM"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "openai",
    "mcp",
    "langgraph",
    "ag-ui-protocol==1.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_rh_ia"]

[tool.uv]
# Versions figées par uv.lock ; `uv sync --locked` refuse un lockfile désynchronisé.
required-version = ">=0.12"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
