[project]
name = "staport-intelligence-ia"
version = "0.1.0"
description = "Service IA de Staport Intelligence : graphe LangGraph, client MCP vers l'API, AG-UI vers Angular, modèles via LiteLLM"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "authlib",
    "openai",
    "mcp",
    "langgraph>=1.2.22",
    "ag-ui-protocol==1.0.0",
    "ag-ui-langgraph==0.0.47",
    "langchain[mcp]>=1.5.0",
    "langchain-litellm>=0.11.2",
    # Version stable (1.109.1, 2026-11-15) : la préversion 1.109.0.dev2 adoptée le 2026-11-01 pour lever la borne openai<3 est remplacée.
    "litellm==1.109.1",
    "copilotkit>=0.1.97",
    "opentelemetry-distro==0.66b2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "openinference-instrumentation-langchain==0.1.81",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.6",
    "deepagents>=0.7.38",
    "fastembed>=0.9.1",
    "aioclamd>=1.1.0",
    "puremagic>=2.2.1",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "openevals>=0.2.5",
    "agentevals>=0.0.9",
    "aimock-pytest>=0.7.0",
    "pre-commit>=4.7.0",
    "pytest-asyncio>=1.4.1.post1",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staport_ia"]

[tool.uv]
# Versions figées par uv.lock ; `uv sync --locked` refuse un lockfile désynchronisé.
required-version = ">=0.12"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
