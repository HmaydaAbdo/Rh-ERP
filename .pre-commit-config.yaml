# Contrôles locaux à chaque commit (KAN-209), rapides : ruff et faits documentation/code. Outil : pre-commit
# (https://pre-commit.com), installé par le groupe `dev` de `ia/`. Aucun contrôle au push (décision du propriétaire,
# 2026-11-15) : pyright, pytest et eslint tournent en CI, et l'Auto-fix de l'application corrige les échecs de la PR.
#   installation : uv run --project ia pre-commit install --hook-type pre-commit
#   tout lancer  : uv run --project ia pre-commit run --all-files
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ia-ruff
        name: ia · ruff (lint et format)
        language: system
        entry: uv run --project ia sh -c "cd ia && ruff check src tests && ruff format --check src tests"
        files: ^ia/.*\.py$
        pass_filenames: false
      - id: api-ruff
        name: api · ruff (lint et format)
        language: system
        entry: uv run --project api sh -c "cd api && ruff check src tests && ruff format --check src tests"
        files: ^api/.*\.py$
        pass_filenames: false
      - id: docs-code
        name: documentation · faits vérifiables contre le code
        language: system
        entry: node scripts/ia/check-docs-code.mjs .
        files: ^(site/docs/|conventions/|AGENTS\.md|CLAUDE\.md|scripts/ia/|ia/|api/src/staport/domains/mcp/)
        pass_filenames: false
      - id: docs-domaines
        name: documentation · domaines
        language: system
        entry: node scripts/check-docs-domaines.mjs .
        files: ^(site/docs/domaines/|conventions/|scripts/check-docs-domaines\.mjs|api/src/staport/domains/)
        pass_filenames: false
