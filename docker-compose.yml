# Stack de production : nginx inner (frontend, sert Angular + reverse-proxy interne vers le
# backend), Spring Boot (backend), PostgreSQL 18 + pgvector. Nginx outer (TLS, point d'entrée
# public) est géré séparément sur le serveur de déploiement, hors de ce fichier — voir
# docs/deployment.md pour l'architecture complète et conventions/deployment.md pour le pattern
# générique.
#
# Production uniquement : aucun `build:`, uniquement des `image:` déjà publiées sur Docker Hub
# (buildées par la CI, voir .github/workflows/ci.yml). Pour le développement actif, lancer le
# backend et/ou le frontend en local contre `docker compose up -d postgres` — voir README.md.
#
# Toutes les variables viennent de `.env` à la racine (voir .env.example) — aucune valeur de
# credentials, secret ou port n'est en dur dans ce fichier (conventions/configuration.md,
# conventions/security.md).

services:
  postgres:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG est obligatoire}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - logging_collector=on
      - -c
      - log_destination=csvlog
      - -c
      - log_directory=/var/lib/postgresql
      - -c
      # PostgreSQL ajoute lui-même .csv à la sortie csvlog.
      - log_filename=postgresql-%Y-%m-%d_%H%M%S
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=off
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Persistance des données — voir docs/deployment.md pour la stratégie de backup (distincte
      # de ce volume, qui ne protège que contre l'arrêt/la recréation du conteneur, pas contre la
      # perte du volume lui-même).
      # PostgreSQL 18 stocke ses données dans un sous-répertoire de ce point de montage ; voir
      # docs/deployment.md pour la migration majeure et le volume PG17 conservé.
      - postgres_data_v18:/var/lib/postgresql
    networks:
      - db-net
    ports:
      # Lié à 127.0.0.1 uniquement : accessible pour l'administration/le backup depuis le serveur
      # lui-même, jamais depuis l'extérieur (conventions/security.md — Postgres n'est jamais
      # exposé à Internet).
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-backup:${BACKUP_IMAGE_TAG:?BACKUP_IMAGE_TAG est obligatoire}
    # Démarré par défaut, comme tous les services : `docker compose pull && docker compose up -d` suffit.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT est obligatoire}
      BACKUP_DIR: /backups
    volumes:
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
    # L'image postgres déclare /var/lib/postgresql comme VOLUME ; ce service ne stocke rien ici.
    # tmpfs évite la création d'un volume anonyme à chaque nouveau conteneur backup.
    tmpfs:
      - /var/lib/postgresql
      - /tmp
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h \"$${PGHOST}\" -p \"$${PGPORT}\" -U \"$${PGUSER}\" -d \"$${PGDATABASE}\" && test -w \"$${BACKUP_DIR}\" && find \"$${BACKUP_DIR}\" -maxdepth 1 -type f -name 'rh-erp-*.tar.gz.age' -mmin -1440 -print -quit | grep -q ."]
      interval: 1m
      timeout: 10s
      start_period: 1h
      retries: 3

  postgres-log-retention:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG est obligatoire}
    # Rétention des journaux pgAudit, démarrée par défaut avec la sauvegarde.
    restart: unless-stopped
    user: postgres
    entrypoint: ["/usr/local/bin/pgaudit-retention-scheduler"]
    command: []
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      # Le job tourne avec le même UID postgres et ne cible que les CSV au premier niveau.
      - postgres_data_v18:/var/lib/postgresql
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 1m
      timeout: 5s
      retries: 3

  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG est obligatoire}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGAUDIT_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      # Deux comptes obligatoires (voir docs/deployment.md, « Deux comptes PostgreSQL ») : le compte applicatif n'a
      # que SELECT et INSERT sur les tables d'audit ; le propriétaire (POSTGRES_USER) ne sert qu'à Flyway.
      DB_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER est obligatoire}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD est obligatoire}
      DB_MIGRATION_USER: ${POSTGRES_USER}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD}
      CHANTIER_SYNC_BASE_URL: ${CHANTIER_SYNC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      # Assistant IA (docs/ia.md, § 5) : route /mcp et jeton agent RS256, actifs par défaut. MCP_ENABLED=false
      # les coupe ; la clé et son identifiant restent alors exigés pour garder un seul .env complet.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_JWT_PRIVATE_KEY: ${MCP_JWT_PRIVATE_KEY:?MCP_JWT_PRIVATE_KEY est obligatoire (voir .env.example)}
      MCP_JWT_KEY_ID: ${MCP_JWT_KEY_ID:?MCP_JWT_KEY_ID est obligatoire}
      MCP_JWT_PREVIOUS_PUBLIC_KEY: ${MCP_JWT_PREVIOUS_PUBLIC_KEY:-}
      MCP_JWT_PREVIOUS_KEY_ID: ${MCP_JWT_PREVIOUS_KEY_ID:-}
      # Traces OpenTelemetry vers Phoenix (docs/ia.md, T18) : requêtes HTTP, outils MCP et requêtes SQL, même trace que le
      # service IA (en-tête W3C traceparent).
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_HEADERS_AUTHORIZATION: Bearer ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
      # Journaux JSON sur la console et dans des archives journalières (30 jours, UTC).
      LOGGING_FORMAT: json
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    networks:
      - db-net
      - web-net
      - runtime-auth-net
      # Le service IA atteint /mcp par ce réseau interne ; nginx ne relaie jamais /mcp.
      - ia-net
      - trace-net
    ports:
      # Lié à 127.0.0.1 : jamais exposé à Internet. Le trafic applicatif réel n'y passe pas — nginx
      # inner atteint le backend via le réseau Docker interne (web-net, nom de service "backend"),
      # voir frontend/nginx.conf. Cette publication loopback ne sert qu'au diagnostic/à l'admin
      # depuis le serveur lui-même.
      - "127.0.0.1:${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG est obligatoire}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web-net
      # Relais /ia/copilotkit/ vers le runtime CopilotKit (nginx.conf).
      - assistant-net
    environment:
      # Clé de l'imagerie satellite, ajoutée aux tuiles par nginx (voir .env.example et docs/chantier/carte.md).
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:?ARCGIS_API_KEY est obligatoire (clé ArcGIS gratuite, voir docs/chantier/carte.md)}
    volumes:
      # Fond de carte auto-hébergé (monde, Maroc détaillé, relief, polices, icônes), produit par
      # scripts/carte/preparer-fond-carte.sh ; lecture seule, hors de l'image (plusieurs dizaines de Go).
      - ${CARTE_FOND_DIR:-./carte-fond}:/usr/share/nginx/html/carte/fond:ro
    ports:
      # Lié à 127.0.0.1 : seul nginx outer (sur ce même serveur, géré séparément) s'y connecte ;
      # jamais exposé directement à Internet (conventions/security.md).
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- IA (voir docs/ia.md) ---------------------------------------------------------------------
  # Démarrés par défaut avec le reste de la pile. Chaque conteneur ne reçoit que ses propres variables du
  # .env racine unique ; IA_ENABLED=false coupe l'assistant sans arrêter l'ERP.
  litellm-db:
    # Même image PostgreSQL que l'ERP, instance et volume séparés : clés virtuelles, budgets et
    # journaux de dépense de LiteLLM uniquement, aucune donnée métier.
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG est obligatoire}
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD est obligatoire}
    volumes:
      - litellm_db_data:/var/lib/postgresql
    networks:
      - ia-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  ia-db:
    # Conversations de l'assistant (checkpointer PostgreSQL de LangGraph, docs/ia.md T19) : instance et volume
    # séparés de l'ERP et de LiteLLM, joignable par le seul service IA, purgée après IA_CONVERSATION_JOURS jours.
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG est obligatoire}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ia
      POSTGRES_USER: ia
      POSTGRES_PASSWORD: ${IA_DB_PASSWORD:?IA_DB_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      - ia_db_data:/var/lib/postgresql
    networks:
      - memoire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia -d ia"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-litellm:${LITELLM_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    environment:
      # Sans clé master, sel ou base, l'image refuse de démarrer (litellm/entrypoint.sh).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY est obligatoire}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY est obligatoire}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD est obligatoire}@litellm-db:5432/litellm
      # Une clé vide désactive ses modèles au démarrage (litellm/filtrer_config.py) : LiteLLM ne bascule
      # pas sur une 401, la question échouerait au lieu de passer au modèle suivant du même tag.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LLM7_API_KEY: ${LLM7_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - ia-db-net
      - ia-net
    ports:
      # Loopback uniquement : administration et tests depuis le serveur, jamais exposé à Internet.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"

  litellm-cles:
    # Tâche ponctuelle : enregistre les clés virtuelles du .env dans une base LiteLLM neuve (litellm/enregistrer_cles.py),
    # puis s'arrête. Une clé déjà connue est laissée telle quelle ; `up -d` suffit, sans script à lancer à la main.
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-litellm:${LITELLM_IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      litellm:
        condition: service_healthy
    entrypoint: ["python3", "/usr/local/bin/erp-rh-enregistrer-cles"]
    command: []
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY est obligatoire}
      LITELLM_GATEWAY_URL: http://litellm:4000/v1/chat/completions
      IA_LITELLM_API_KEY: ${IA_LITELLM_API_KEY:?IA_LITELLM_API_KEY est obligatoire}
      LITELLM_TEST_API_KEY: ${LITELLM_TEST_API_KEY:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - ia-net

  ia:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-ia:${IA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      litellm-cles:
        condition: service_completed_successfully
      ia-db:
        condition: service_healthy
    environment:
      # Conversations durables : base dédiée (ia-db) ; une conversation inactive est supprimée après ce nombre de jours.
      IA_DATABASE_URL: postgresql://ia:${IA_DB_PASSWORD:?IA_DB_PASSWORD est obligatoire (voir .env.example)}@ia-db:5432/ia
      IA_CONVERSATION_JOURS: ${IA_CONVERSATION_JOURS:-30}
      # Interrupteur global de l'IA, actif par défaut ; une variable obligatoire manquante empêche le démarrage.
      IA_ENABLED: ${IA_ENABLED:-true}
      IA_LITELLM_BASE_URL: http://litellm:4000/v1
      IA_LITELLM_API_KEY: ${IA_LITELLM_API_KEY:?IA_LITELLM_API_KEY est obligatoire (clé virtuelle LiteLLM, litellm/README.md)}
      # Jeton agent et route /mcp du backend, par le réseau ia-net.
      IA_ERP_API_URL: http://backend:8080
      # Traces OpenTelemetry vers Phoenix (docs/ia.md, T18), jeton partagé par le réseau interne trace-net.
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: erp-rh-ia
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - ia-net
      - runtime-net
      - trace-net
      - memoire-net
    ports:
      - "127.0.0.1:${IA_PORT:-5003}:8000"

  # Runtime CopilotKit officiel (docs/ia.md, T16) : seul point d'entrée de l'assistant pour le navigateur (relayé par
  # nginx). Il applique le middleware A2UI et relaie l'agent AG-UI du service IA avec le jeton de l'utilisateur.
  copilot-runtime:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-copilot-runtime:${COPILOT_RUNTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ia:
        condition: service_healthy
    environment:
      IA_AGUI_URL: http://ia:8000/agui
      # Authentification de chaque requête de l'assistant auprès de Spring (/auth/me), par le réseau runtime-auth-net.
      ERP_API_URL: http://backend:8080
      # Traces OpenTelemetry vers Phoenix (docs/ia.md, T18), jeton partagé par le réseau interne trace-net.
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: erp-rh-copilot-runtime
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
    volumes:
      - runtime_data:/data
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - runtime-net
      - assistant-net
      - trace-net
      - runtime-auth-net
    # Pour `ng serve` en développement (proxy.conf.js) ; en production, nginx passe par le réseau assistant-net.
    ports:
      - "127.0.0.1:${COPILOT_RUNTIME_PORT:-5004}:4100"

  # Phoenix (Arize) : traces OpenTelemetry de l'assistant, du clic à la base (docs/ia.md, T18). Un seul conteneur, base
  # SQLite dans le volume, conservation 30 jours ; interface sur 127.0.0.1 seulement, connexion obligatoire.
  phoenix:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/erp-rh-phoenix:${PHOENIX_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PHOENIX_SECRET: ${PHOENIX_SECRET:?PHOENIX_SECRET est obligatoire (voir .env.example)}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?PHOENIX_ADMIN_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      - phoenix_data:/data
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - trace-net
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"

volumes:
  postgres_data_v18:
  litellm_db_data:
  ia_db_data:
  runtime_data:
  phoenix_data:

networks:
  # postgres n'est joignable que par le backend — le frontend (nginx inner) ne peut pas
  # l'atteindre directement, même en cas de compromission du conteneur frontend.
  db-net:
  # backend <-> frontend (proxy_pass de nginx inner vers le backend, voir frontend/nginx.conf).
  web-net:
  # litellm et sa base, isolés du reste.
  ia-db-net:
  # service IA et sa base de conversations, seuls.
  memoire-net:
  # ia, litellm et le backend (route /mcp).
  ia-net:
  # frontend (nginx) et runtime CopilotKit seulement : le navigateur atteint l'assistant, jamais le service IA ni LiteLLM.
  assistant-net:
  # runtime CopilotKit et service IA.
  runtime-net:
  # Runtime CopilotKit et backend seuls : le runtime y authentifie chaque requête de l'assistant (/auth/me).
  runtime-auth-net:
  # Traces OpenTelemetry : backend, service IA, runtime CopilotKit et Phoenix seulement.
  trace-net:
