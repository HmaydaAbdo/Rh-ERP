# Stack de production : nginx inner (frontend, sert Angular + reverse-proxy interne vers
# l'API), API FastAPI (api), PostgreSQL 18 + pgvector. Nginx outer (TLS, point d'entrée
# public) est géré séparément sur le serveur de déploiement, hors de ce fichier — voir
# site/docs/exploitation/deploiement.md pour l'architecture complète et conventions/deployment.md pour le pattern
# générique.
#
# Production uniquement : aucun `build:`, uniquement des `image:` déjà publiées sur Docker Hub
# (buildées par la CI, voir .github/workflows/ci.yml). Pour le développement actif, lancer le
# backend et/ou le frontend en local contre `docker compose up -d postgres` — voir README.md.
#
# Toutes les variables viennent de `.env` à la racine (voir .env.example) — aucune valeur de
# credentials, secret ou port n'est en dur dans ce fichier (conventions/configuration.md,
# conventions/security.md).

services:
  postgres:
    container_name: erp-rh-postgres
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG est obligatoire}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - logging_collector=on
      - -c
      - log_destination=csvlog
      - -c
      - log_directory=/var/lib/postgresql
      - -c
      # PostgreSQL ajoute lui-même .csv à la sortie csvlog.
      - log_filename=postgresql-%Y-%m-%d_%H%M%S
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=off
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Un compte et une base par service, créés par l'entrée de l'image (database/entrypoint.sh), idempotent : traces
      # Phoenix, clés et budgets LiteLLM, conversations de l'assistant. Chaque compte ne se connecte qu'à sa base.
      PHOENIX_DB_PASSWORD: ${PHOENIX_DB_PASSWORD:?PHOENIX_DB_PASSWORD est obligatoire (voir .env.example)}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD est obligatoire (voir .env.example)}
      IA_DB_PASSWORD: ${IA_DB_PASSWORD:?IA_DB_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      # Persistance des données — voir site/docs/exploitation/deploiement.md pour la stratégie de backup (distincte
      # de ce volume, qui ne protège que contre l'arrêt/la recréation du conteneur, pas contre la
      # perte du volume lui-même).
      # PostgreSQL 18 stocke ses données dans un sous-répertoire de ce point de montage ; voir
      # site/docs/exploitation/deploiement.md pour la migration majeure et le volume PG17 conservé.
      - postgres_data_v18:/var/lib/postgresql
    networks:
      - db-net
      - bases-net
    ports:
      # Lié à 127.0.0.1 uniquement : accessible pour l'administration/le backup depuis le serveur
      # lui-même, jamais depuis l'extérieur (conventions/security.md — Postgres n'est jamais
      # exposé à Internet).
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      # TCP uniquement : le socket d'initdb devient prêt avant le serveur final, puis s'arrête. Sain seulement une fois les
      # trois bases de service créées.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB} && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc \"SELECT count(*) FROM pg_database WHERE datname IN ('phoenix','litellm','ia')\" | grep -qx 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    container_name: erp-rh-backup
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-backup:${BACKUP_IMAGE_TAG:?BACKUP_IMAGE_TAG est obligatoire}
    # Démarré par défaut, comme tous les services : `docker compose pull && docker compose up -d` suffit.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT est obligatoire}
      BACKUP_DIR: /backups
      # Base des traces Phoenix : sauvegardée dans la même archive chiffrée que la base de l'ERP.
      PHOENIX_DB: phoenix
      LITELLM_DB: litellm
      IA_DB: ia
    volumes:
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
    # L'image postgres déclare /var/lib/postgresql comme VOLUME ; ce service ne stocke rien ici.
    # tmpfs évite la création d'un volume anonyme à chaque nouveau conteneur backup.
    tmpfs:
      - /var/lib/postgresql
      - /tmp
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h \"$${PGHOST}\" -p \"$${PGPORT}\" -U \"$${PGUSER}\" -d \"$${PGDATABASE}\" && test -w \"$${BACKUP_DIR}\" && find \"$${BACKUP_DIR}\" -maxdepth 1 -type f \\( -name 'staport-intelligence-*.tar.gz.age' -o -name 'rh-erp-*.tar.gz.age' \\) -mmin -1440 -print -quit | grep -q ."]
      interval: 1m
      timeout: 10s
      start_period: 1h
      retries: 3

  postgres-log-retention:
    container_name: erp-rh-postgres-log-retention
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-postgres:${POSTGRES_IMAGE_TAG:?POSTGRES_IMAGE_TAG est obligatoire}
    # Rétention des journaux pgAudit, démarrée par défaut avec la sauvegarde.
    restart: unless-stopped
    user: postgres
    entrypoint: ["/usr/local/bin/pgaudit-retention-scheduler"]
    command: []
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      # Le job tourne avec le même UID postgres et ne cible que les CSV au premier niveau.
      - postgres_data_v18:/var/lib/postgresql
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 1m
      timeout: 5s
      retries: 3

  api:
    container_name: erp-rh-api
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Arrêt en douceur (KAN-39) : le run en cours termine son étape et enregistre son point de reprise.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_healthy
        required: false
    environment:
      # Migrations Alembic au démarrage (api/entrypoint.sh) avec le propriétaire du schéma ; ces deux identifiants sont retirés
      # de l'environnement du serveur avant son lancement.
      DB_MIGRATION_USER: ${POSTGRES_USER}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD}
      PGAUDIT_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER est obligatoire}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD est obligatoire}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_JWT_PRIVATE_KEY: ${MCP_JWT_PRIVATE_KEY:?MCP_JWT_PRIVATE_KEY est obligatoire}
      MCP_JWT_KEY_ID: ${MCP_JWT_KEY_ID:?MCP_JWT_KEY_ID est obligatoire}
      MCP_JWT_PREVIOUS_PUBLIC_KEY: ${MCP_JWT_PREVIOUS_PUBLIC_KEY:-}
      MCP_JWT_PREVIOUS_KEY_ID: ${MCP_JWT_PREVIOUS_KEY_ID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      CHANTIER_SYNC_BASE_URL: ${CHANTIER_SYNC_BASE_URL}
      LOGGING_FORMAT: json
      LOGGING_FILE_PATH: /app/logs
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: staport-intelligence-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      # Journaux JSON archivés chaque jour, compressés, gardés 30 jours ; le dossier doit être inscriptible par l'uid 10001.
      - type: bind
        source: ./logs
        target: /app/logs
    networks:
      - db-net
      - web-net
      - runtime-auth-net
      # Le service IA atteint /mcp par ce réseau interne ; nginx ne relaie jamais /mcp.
      - ia-net
      - trace-net
    ports:
      # Lié à 127.0.0.1 : jamais exposé à Internet. Le trafic applicatif passe par nginx inner (web-net, service "api").
      - "127.0.0.1:${API_PORT}:8080"

  frontend:
    container_name: erp-rh-frontend
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG est obligatoire}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web-net
      # Relais /ia/copilotkit/ vers le runtime CopilotKit (nginx.conf).
      - assistant-net
    environment:
      # Clé de l'imagerie satellite, ajoutée aux tuiles par nginx (voir .env.example et site/docs/domaines/chantier/carte.md).
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:?ARCGIS_API_KEY est obligatoire (clé ArcGIS gratuite, voir site/docs/domaines/chantier/carte.md)}
    volumes:
      # Fond de carte auto-hébergé (monde, Maroc détaillé, relief, polices, icônes), produit par
      # scripts/carte/preparer-fond-carte.sh ; lecture seule, hors de l'image (plusieurs dizaines de Go).
      - ${CARTE_FOND_DIR:-./carte-fond}:/usr/share/nginx/html/carte/fond:ro
    ports:
      # Lié à 127.0.0.1 : seul nginx outer (sur ce même serveur, géré séparément) s'y connecte ;
      # jamais exposé directement à Internet (conventions/security.md).
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Documentation (site statique Docusaurus, voir site/). Aucune dépendance : ni base ni backend.
  docs:
    container_name: erp-rh-docs
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-docs:${DOCS_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - web-net
    ports:
      # Lié à 127.0.0.1 : seul nginx outer s'y connecte et pose l'authentification (site/docs/exploitation/deploiement.md).
      - "127.0.0.1:${DOCS_PORT:-5005}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- IA (voir site/docs/ia) ---------------------------------------------------------------------
  # Démarrés par défaut avec le reste de la pile. Chaque conteneur ne reçoit que ses propres variables du
  # .env racine unique ; IA_ENABLED=false coupe l'assistant sans arrêter l'ERP.
  litellm:
    container_name: erp-rh-litellm
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-litellm:${LITELLM_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Sans clé master, sel ou base, l'image refuse de démarrer (litellm/entrypoint.sh).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY est obligatoire}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY est obligatoire}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD est obligatoire}@postgres:5432/litellm
      # Une clé vide écarte ses modèles du routage (sondes natives de LiteLLM, litellm/litellm_config.yaml) : LiteLLM ne
      # bascule pas sur une 401, la question échouerait au lieu de passer au modèle suivant du même groupe.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LLM7_API_KEY: ${LLM7_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      # Clés virtuelles enregistrées par l'entrée de l'image dès que la passerelle répond (litellm/entrypoint.sh).
      IA_LITELLM_API_KEY: ${IA_LITELLM_API_KEY:?IA_LITELLM_API_KEY est obligatoire}
      LITELLM_TEST_API_KEY: ${LITELLM_TEST_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - bases-net
      - ia-net
    ports:
      # Loopback uniquement : administration et tests depuis le serveur, jamais exposé à Internet.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"

  ia:
    container_name: erp-rh-ia
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-ia:${IA_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Arrêt en douceur (KAN-39) : le run en cours termine son étape et enregistre son point de reprise.
    stop_grace_period: 60s
    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Traces : attendre que Phoenix réponde évite de perdre les premiers lots ; facultatif (required: false), l'ERP
      # démarre même si l'observabilité est en panne.
      phoenix:
        condition: service_healthy
        required: false
    environment:
      # Conversations durables : base `ia` du PostgreSQL de l'ERP ; une conversation inactive est supprimée après ce nombre de jours.
      IA_DATABASE_URL: postgresql://ia:${IA_DB_PASSWORD:?IA_DB_PASSWORD est obligatoire (voir .env.example)}@postgres:5432/ia
      IA_CONVERSATION_JOURS: ${IA_CONVERSATION_JOURS:-30}
      # Second filet (KAN-265) : groupe LiteLLM essayé si le modèle principal échoue ; vide = aucun repli.
      IA_LLM_REPLI: ${IA_LLM_REPLI:-medium}
      # Interrupteur global de l'IA, actif par défaut ; une variable obligatoire manquante empêche le démarrage.
      IA_ENABLED: ${IA_ENABLED:-true}
      # Pièces jointes (KAN-93) : activées ; chaque fichier est contrôlé (type réel) puis analysé par ClamAV. Sans antivirus
      # joignable, aucun fichier n'est accepté. IA_PIECES_JOINTES=false les coupe.
      IA_PIECES_JOINTES: ${IA_PIECES_JOINTES:-true}
      IA_ANTIVIRUS_HOTE: antivirus
      # Documents Word, PowerPoint et Excel créés par l'agent : deux serveurs MCP locaux (services mcp-office et mcp-excel),
      # gratuits, sans accès Internet ; l'agent range le fichier produit dans l'espace de l'utilisateur. Vider la clé
      # (IA_BUREAUTIQUE_CLE) retire les deux compétences.
      IA_BUREAUTIQUE_CLE: ${IA_BUREAUTIQUE_CLE:?IA_BUREAUTIQUE_CLE est obligatoire (voir .env.example)}
      IA_BUREAUTIQUE_OFFICE_URL: http://mcp-office:8958/mcp
      IA_BUREAUTIQUE_EXCEL_URL: http://mcp-excel:8017/mcp
      IA_BUREAUTIQUE_DOSSIER: /documents
      IA_LITELLM_BASE_URL: http://litellm:4000/v1
      # Le SDK utilise le catalogue livré avec sa version ; pas de téléchargement GitHub sur le chemin des appels.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      IA_LITELLM_API_KEY: ${IA_LITELLM_API_KEY:?IA_LITELLM_API_KEY est obligatoire (clé virtuelle LiteLLM, litellm/README.md)}
      # Jeton agent et route /mcp de l'API, par le réseau ia-net.
      IA_ERP_API_URL: http://api:8080
      # Traces OpenTelemetry vers Phoenix (site/docs/ia, T18), jeton partagé par le réseau interne trace-net.
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: staport-intelligence-ia
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
      # Les spans de l'agent portent beaucoup d'attributs (messages, outils) : la limite par défaut (128) les tronquait et inondait le journal.
      OTEL_ATTRIBUTE_COUNT_LIMIT: "1024"
      OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT: "1024"
      # Contenus conservés en clair dans Phoenix (décision du propriétaire, 2026-11-04) : conversations, arguments et résultats
      # d'outils servent à analyser ce qui s'est passé et à améliorer l'agent. Phoenix reste privé (127.0.0.1, connexion obligatoire).
      OPENINFERENCE_HIDE_INPUTS: "false"
      OPENINFERENCE_HIDE_OUTPUTS: "false"
      # Les sondes de santé (Docker, /health/ready) ne sont pas tracées.
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "health"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    volumes:
      # Sortie du serveur Word/PowerPoint : l'agent lit le fichier produit, le range dans l'espace de l'utilisateur, puis le supprime.
      - docs_sortie:/documents
    tmpfs:
      - /tmp
    networks:
      - ia-net
      - runtime-net
      - trace-net
      - bases-net
      - av-net
      - docs-net
    ports:
      - "127.0.0.1:${IA_PORT:-5003}:8000"

  # Runtime CopilotKit officiel (site/docs/ia, T16) : seul point d'entrée de l'assistant pour le navigateur (relayé par
  # nginx). Il applique le middleware A2UI et relaie l'agent AG-UI du service IA avec le jeton de l'utilisateur.
  copilot-runtime:
    container_name: erp-rh-copilot-runtime
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-copilot-runtime:${COPILOT_RUNTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ia:
        condition: service_healthy
      # Traces : attendre que Phoenix réponde évite de perdre les premiers lots ; facultatif (required: false), l'ERP
      # démarre même si l'observabilité est en panne.
      phoenix:
        condition: service_healthy
        required: false
    environment:
      IA_AGUI_URL: http://ia:8000/agui
      # Dictée (KAN-93) : Whisper local sur CPU (service stt), API compatible OpenAI ; l'audio ne quitte pas les serveurs.
      # Vider STT_URL retire le micro de la discussion.
      STT_URL: ${STT_URL-http://stt:8000}
      STT_MODELE: ${STT_MODELE:-Systran/faster-whisper-base}
      # Les conversations sans échange depuis ce nombre de jours sont supprimées (liste, historique), comme dans le service IA.
      CONVERSATION_JOURS: ${IA_CONVERSATION_JOURS:-30}
      # Authentification de chaque requête de l'assistant auprès de l'API (/auth/me), par le réseau runtime-auth-net.
      ERP_API_URL: http://api:8080
      # Traces OpenTelemetry vers Phoenix (site/docs/ia, T18), jeton partagé par le réseau interne trace-net.
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: staport-intelligence-copilot-runtime
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
    volumes:
      - runtime_data:/data
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - runtime-net
      - assistant-net
      - trace-net
      - runtime-auth-net
      - stt-net
    # Pour `ng serve` en développement (proxy.conf.js) ; en production, nginx passe par le réseau assistant-net.
    ports:
      - "127.0.0.1:${COPILOT_RUNTIME_PORT:-5004}:4100"

  # Antivirus des pièces jointes (KAN-93) : ClamAV (clamd), joignable par le seul service IA, qui lui envoie chaque fichier
  # joint (INSTREAM) avant tout modèle. Les signatures se mettent à jour seules (freshclam) ; le premier démarrage les
  # télécharge (quelques minutes, ~1 Go de RAM). Pas encore prêt, il fait refuser les pièces jointes (échec fermé).
  antivirus:
    container_name: erp-rh-antivirus
    image: clamav/clamav:${CLAMAV_IMAGE_TAG:-1.5.4}
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      # Pièces jointes jusqu'à 500 Mo (KAN-93) : clamd refuse par défaut les flux de plus de 100 Mo.
      CLAMD_CONF_StreamMaxLength: 520M
      CLAMD_CONF_MaxFileSize: 520M
      CLAMD_CONF_MaxScanSize: 1000M
    volumes:
      - antivirus_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    networks:
      - av-net

  # Documents Word et PowerPoint de l'agent : mcp-ms-office-documents (MIT), image épinglée par empreinte. Aucune exécution
  # de code ni accès Internet (réseau docs-net interne) ; le fichier produit arrive dans le volume docs_sortie.
  mcp-office:
    container_name: erp-rh-mcp-office
    image: georgx22/mcp-office-docs@sha256:94fb2e12f30bec1dca83eb2c58fd7cfb8f04da5f2a3506b94219d8b6197078e8
    restart: unless-stopped
    environment:
      API_KEY: ${IA_BUREAUTIQUE_CLE:?IA_BUREAUTIQUE_CLE est obligatoire (voir .env.example)}
    volumes:
      - docs_sortie:/app/output
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - docs-net

  # Classeurs Excel de l'agent : excel-mcp-server (MIT) fixé en version exacte (excel-mcp/Dockerfile) ; les classeurs vivent
  # dans une mémoire volatile, l'export les renvoie à l'agent qui les range dans l'espace de l'utilisateur.
  mcp-excel:
    container_name: erp-rh-mcp-excel
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-mcp-excel:${MCP_EXCEL_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      EXCEL_MCP_AUTH_TOKEN: ${IA_BUREAUTIQUE_CLE:?IA_BUREAUTIQUE_CLE est obligatoire (voir .env.example)}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /data
    networks:
      - docs-net

  # Transcription vocale locale (KAN-93) : Speaches (faster-whisper, API compatible OpenAI), sur CPU, gratuit, sans
  # compte ni envoi d'audio à un tiers. Joignable par le seul runtime CopilotKit. Le modèle est téléchargé une fois (cache
  # dans le volume stt_models) ; seul ce service sort vers Hugging Face pour cela.
  stt:
    container_name: erp-rh-stt
    image: ghcr.io/speaches-ai/speaches:${STT_IMAGE_TAG:-0.8.3-cpu}
    restart: unless-stopped
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      # Vitesse (recette du 2026-11-17 : 54 s pour 3 s de voix après 5 min d'inactivité, 6 s pour 6 s de voix modèle
      # chargé). `int8` : le type par défaut (float16) n'est pas géré par un processeur ; `TTL=-1` : le modèle reste en
      # mémoire (par défaut il se décharge après 300 s et se recharge en 34 s) ; `CPU_THREADS` : 0 = valeur de la bibliothèque
      # (4). Mesure du 2026-11-17 (modèle base, 3 s de voix, 16 cœurs logiques) : 4 threads 2,6 s, 8 threads 2,0 s, 10 threads
      # 5,8 s, 16 threads 7,5 s : ne pas dépasser le nombre de cœurs physiques (la moitié des cœurs logiques en général).
      WHISPER__COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      WHISPER__TTL: "-1"
      WHISPER__CPU_THREADS: ${STT_CPU_THREADS:-0}
    volumes:
      - stt_models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - stt-net

  # Téléchargement du modèle de dictée au démarrage : Speaches 0.8.x ne précharge rien (PRELOAD_MODELS n'existe pas), sans
  # modèle installé la transcription répond 404 et le micro ne fait rien. Ce service appelle l'API officielle d'installation
  # d'un modèle ; il est sans effet (rapide) quand le modèle est déjà dans le volume stt_models, puis le charge en mémoire
  # (`/api/ps`) pour que la première dictée n'attende pas le chargement, et s'arrête.
  stt-modele:
    container_name: erp-rh-stt-modele
    image: ghcr.io/speaches-ai/speaches:${STT_IMAGE_TAG:-0.8.3-cpu}
    restart: "no"
    depends_on:
      stt:
        condition: service_healthy
    entrypoint: ["curl", "--fail", "--silent", "--show-error", "--max-time", "1800", "--retry", "5", "--retry-delay", "10", "--retry-all-errors", "-X", "POST", "http://stt:8000/v1/models/${STT_MODELE:-Systran/faster-whisper-base}", "--next", "--fail", "--silent", "--show-error", "--max-time", "300", "-X", "POST", "http://stt:8000/api/ps/${STT_MODELE:-Systran/faster-whisper-base}"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - stt-net

  # Phoenix (Arize) : traces OpenTelemetry de l'assistant, du clic à la base (site/docs/ia, T18). Un seul conteneur, traces
  # conservées sans limite dans la base `phoenix` du PostgreSQL de l'ERP ; interface sur 127.0.0.1 seulement, connexion obligatoire.
  phoenix:
    container_name: erp-rh-phoenix
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME est obligatoire}/staport-intelligence-phoenix:${PHOENIX_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHOENIX_POSTGRES_HOST: postgres
      PHOENIX_POSTGRES_PORT: "5432"
      PHOENIX_POSTGRES_USER: phoenix
      PHOENIX_POSTGRES_PASSWORD: ${PHOENIX_DB_PASSWORD:?PHOENIX_DB_PASSWORD est obligatoire (voir .env.example)}
      PHOENIX_POSTGRES_DB: phoenix
      PHOENIX_SECRET: ${PHOENIX_SECRET:?PHOENIX_SECRET est obligatoire (voir .env.example)}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:?PHOENIX_ADMIN_SECRET est obligatoire (voir .env.example)}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?PHOENIX_ADMIN_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      - phoenix_data:/data
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - trace-net
      - bases-net
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"

volumes:
  postgres_data_v18:
  runtime_data:
  phoenix_data:
  stt_models:
  antivirus_db:
  docs_sortie:

networks:
  # postgres n'est joignable que par le backend — le frontend (nginx inner) ne peut pas
  # l'atteindre directement, même en cas de compromission du conteneur frontend.
  db-net:
  # backend <-> frontend (proxy_pass de nginx inner vers le backend, voir frontend/nginx.conf).
  web-net:
  # ia, litellm et le backend (route /mcp).
  ia-net:
  # frontend (nginx) et runtime CopilotKit seulement : le navigateur atteint l'assistant, jamais le service IA ni LiteLLM.
  assistant-net:
  # runtime CopilotKit et service IA.
  runtime-net:
  # Runtime CopilotKit et backend seuls : le runtime y authentifie chaque requête de l'assistant (/auth/me).
  runtime-auth-net:
  # Pièces jointes (KAN-93) : service IA et antivirus seulement.
  av-net:
  # Documents de l'agent : service IA et serveurs MCP Word/PowerPoint et Excel seulement, sans accès Internet.
  docs-net:
    internal: true
  # Dictée (KAN-93) : runtime CopilotKit et service de transcription seulement.
  stt-net:
  # Traces OpenTelemetry : backend, service IA, runtime CopilotKit et Phoenix seulement.
  trace-net:
  # PostgreSQL de l'ERP et ses trois clients de service (Phoenix, LiteLLM, IA), chacun limité à sa base par son compte.
  bases-net:
