[project]
name = "staport-api"
version = "0.1.0"
description = "Backend unifié Staport Intelligence (ADR 0016) : FastAPI, un seul conteneur avec le service IA. Prototype du domaine common (KAN-47)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "alembic>=1.20.1",
    "greenlet>=3.5.6",
    "pyjwt[crypto]>=2.15.1",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "aiosmtplib>=5.1.3",
    "apscheduler>=3.11.1,<4",
    "opentelemetry-api>=1.30",
    "fastmcp>=4.1.6,<5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pyright",
    "testcontainers[postgres]>=4.15.0",
    "opentelemetry-sdk>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staport"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
