router_settings:
  # Les capacités simples gardent la bascule pondérée ; les questions complexes suivent le déploiement
  # le plus rapide observé via le routage officiel par latence (TTL documenté par LiteLLM).
  routing_strategy: simple-shuffle
  routing_groups:
    - group_name: complex-low-latency
      models: [ai-gateway-complex]
      routing_strategy: latency-based-routing
      routing_strategy_args:
        ttl: 3600
  enable_weighted_failover: true
  # Jusqu'à 3 tentatives supplémentaires sur d'autres déploiements du même groupe (4 modèles au plus).
  max_fallbacks: 3
  enable_tag_filtering: false
  tag_filtering_match_any: true
  enable_pre_call_checks: true
  # Ne jamais réessayer le même déploiement : ce serait dépenser deux fois le même quota.
  num_retries: 0
  timeout: 120
  # 429/401/404/408 mettent un déploiement en cooldown immédiatement ; autres erreurs après 2 échecs/min.
  allowed_fails: 1
  cooldown_time: 120

litellm_settings:
  drop_params: true
  # Une réponse JSON non conforme au schéma est une erreur et bascule vers un autre modèle du même groupe.
  enable_json_schema_validation: true
  request_timeout: 120
  set_verbose: false
  json_logs: true
  overwrite_user_with_key_hash: true
  # Jamais de réponse partagée entre clés ou utilisateurs.
  cache: false

# Détection d'injection de prompt : garde-fou officiel `litellm_content_filter` (mots-clés, sans modèle ni service en plus),
# appliqué à chaque requête (default_on) avant d'atteindre un modèle ; une tentative évidente est refusée (400).
# Ne pas utiliser le rappel `detect_prompt_injection` : sa comparaison floue (difflib) parcourt chaque caractère du prompt pour
# chaque mot-clé ; sur le long prompt de l'assistant (consignes et schémas d'outils) il occupe le processeur pendant des minutes,
# bloque la passerelle et rejette des requêtes légitimes. Les listes de mots-clés sont en anglais : elles complètent, sans la
# remplacer, la protection par les permissions revérifiées à chaque appel (conventions/agents-ia.md, « Injection »).
guardrails:
  - guardrail_name: injection-de-prompt
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      # Expressions françaises d'abandon des consignes (les listes officielles ci-dessous sont en anglais).
      blocked_words:
        - { keyword: "ignore tes règles", action: BLOCK }
        - { keyword: "ignore tes consignes", action: BLOCK }
        - { keyword: "ignore tes instructions", action: BLOCK }
        - { keyword: "ignore les instructions précédentes", action: BLOCK }
        - { keyword: "oublie tes instructions", action: BLOCK }
        - { keyword: "oublie tes règles", action: BLOCK }
        - { keyword: "montre ton prompt système", action: BLOCK }
        - { keyword: "affiche ton prompt système", action: BLOCK }
        - { keyword: "sans aucune restriction", action: BLOCK }
      categories:
        - category: prompt_injection_jailbreak
          enabled: true
          action: BLOCK
          severity_threshold: medium

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Aucun proxy devant LiteLLM : ses clients (service IA, enregistrement des clés, poste local) s'y connectent directement.
  # Liste vide = l'adresse du pair est la source ; les échecs de connexion à l'interface d'administration sont alors aussi
  # limités par adresse.
  trusted_proxy_ranges: []
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  maximum_spend_logs_retention_period: "30d"
