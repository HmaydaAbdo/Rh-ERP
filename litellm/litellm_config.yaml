# Passerelle LiteLLM d'ERP-RH (image erp-rh-litellm). Aucun secret ici : uniquement des références
# os.environ/… résolues depuis le .env racine unique (voir litellm/README.md et docs/ia.md).
#
# Un alias compatible OpenAI : `ai-gateway`. Le client envoie un tag de capacité dans metadata.tags :
# simple | medium | complex | code | ocr (sans tag = `default`, même pool que medium).
#
# Règles de routage (vérifiées dans le code du routeur LiteLLM v1.104.2) :
# - Un seul déploiement appelé à la fois (simple-shuffle pondéré). Jamais d'envoi parallèle.
# - Sur erreur/429, enable_weighted_failover choisit un AUTRE déploiement portant le MÊME tag, jusqu'à
#   max_fallbacks tentatives. Ne pas réintroduire de niveaux `order:` : avec plusieurs niveaux, LiteLLM
#   saute directement au niveau suivant sans essayer les autres modèles du même niveau.
# - Chaque pool ne contient que des modèles acceptables pour la tâche. Pool épuisé = échec explicite,
#   jamais une réponse d'un modèle plus faible.
# - Les offres « pas pour la production » (NVIDIA Developer, preview Groq, essai Cerebras) ne portent
#   que des tags opt-in `eval`, `eval-<capacité>`. La clé d'ERP-RH porte metadata {"tags": ["!eval"]}.
# - Sans tag, si tout le pool `default` est en cooldown, LiteLLM se rabat sur n'importe quel
#   déploiement sain du groupe : toujours envoyer un tag.
# - Chaque déploiement porte aussi `id:<model_info.id>` pour cibler un modèle précis (tests, évaluations).
#
# Une seule instance, un seul worker : l'état du routeur (cooldowns, limites) reste en mémoire, sans Redis.
# Quotas : `rpm` seulement là où le fournisseur le documente (appliqué par enable_pre_call_checks).
#
# Paliers gratuits : réservés aux données publiques ou synthétiques (docs/ia.md, § 2).
model_list:
  # ---------------------------------------------------------------- Google Gemini API (palier gratuit)
  # Le contenu du palier gratuit sert à améliorer les produits Google. Limites par projet et par modèle,
  # visibles dans AI Studio ; quota journalier remis à zéro à minuit, heure du Pacifique.
  - model_name: ai-gateway
    model_info: { id: gemini-3.8-flash }
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      weight: 5
      timeout: 60
      max_parallel_requests: 3
      tags: [complex, code, ocr, "id:gemini-3.8-flash"]

  - model_name: ai-gateway
    model_info: { id: gemini-3.5-flash-lite }
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      weight: 5
      timeout: 30
      max_parallel_requests: 3
      tags: [simple, ocr, "id:gemini-3.5-flash-lite"]

  # Gemma 4 sur l'API Gemini : gratuit, entrée image, quota distinct des modèles Gemini Flash.
  - model_name: ai-gateway
    model_info: { id: gemini-gemma-4-31b }
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GEMINI_API_KEY
      weight: 4
      timeout: 60
      max_parallel_requests: 2
      tags: [medium, ocr, default, "id:gemini-gemma-4-31b"]

  - model_name: ai-gateway
    model_info: { id: gemini-gemma-4-26b }
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GEMINI_API_KEY
      weight: 4
      timeout: 30
      max_parallel_requests: 2
      tags: [simple, "id:gemini-gemma-4-26b"]

  # ---------------------------------------------------------------- Groq (Free plan)
  # Limites documentées par modèle : 30 RPM, 1K RPD, 8K TPM, 200K TPD (au niveau de l'organisation).
  # 8K TPM compte entrée + sortie (raisonnement inclus) : garder les prompts sous ~5K tokens.
  - model_name: ai-gateway
    model_info: { id: groq-gpt-oss-120b, max_input_tokens: 5000 }
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      weight: 5
      rpm: 30
      timeout: 45
      max_parallel_requests: 4
      tags: [medium, complex, code, default, "id:groq-gpt-oss-120b"]

  - model_name: ai-gateway
    model_info: { id: groq-gpt-oss-20b, max_input_tokens: 5000 }
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      weight: 5
      rpm: 30
      timeout: 30
      max_parallel_requests: 4
      tags: [simple, "id:groq-gpt-oss-20b"]

  # ---------------------------------------------------------------- Mistral (Free mode)
  # Limites visibles dans Admin > Limits. Les requêtes gratuites peuvent servir à l'entraînement
  # sauf désactivation dans Admin Console > Privacy.
  - model_name: ai-gateway
    model_info: { id: mistral-small }
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      weight: 3
      timeout: 60
      max_parallel_requests: 2
      tags: [medium, complex, code, default, "id:mistral-small"]

  # ---------------------------------------------------------------- Cloudflare Workers AI
  # 10 000 Neurons/jour partagés par TOUS les modèles du compte (remise à zéro 00:00 UTC). Rester en
  # Workers Free pour 0 $. LiteLLM construit l'URL /ai/v1 depuis CLOUDFLARE_ACCOUNT_ID.
  - model_name: ai-gateway
    model_info: { id: cloudflare-gpt-oss-120b, max_input_tokens: 16000 }
    litellm_params:
      model: cloudflare/@cf/openai/gpt-oss-120b
      api_key: os.environ/CLOUDFLARE_API_KEY
      weight: 2
      timeout: 60
      max_parallel_requests: 2
      tags: [complex, code, "id:cloudflare-gpt-oss-120b"]

  - model_name: ai-gateway
    model_info: { id: cloudflare-glm-47-flash, max_input_tokens: 16000 }
    litellm_params:
      model: cloudflare/@cf/zai-org/glm-4.7-flash
      api_key: os.environ/CLOUDFLARE_API_KEY
      weight: 2
      timeout: 30
      max_parallel_requests: 2
      tags: [simple, "id:cloudflare-glm-47-flash"]

  # ---------------------------------------------------------------- OpenRouter (modèles :free uniquement)
  # 20 RPM ; 50 requêtes/jour pour tout le compte tant que moins de 10 crédits ont été achetés.
  - model_name: ai-gateway
    model_info: { id: openrouter-gemma-4-31b-free }
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      weight: 1
      rpm: 20
      timeout: 60
      max_parallel_requests: 1
      tags: [simple, medium, ocr, default, "id:openrouter-gemma-4-31b-free"]

  # ================================================================ Pool d'évaluation (opt-in)
  # Jamais choisi par les seuls tags de capacité. Utiliser ["eval"], ["eval-<capacité>"],
  # ["<capacité>", "eval-<capacité>"] ou ["id:<déploiement>"].

  # Modèle preview Groq : « à des fins d'évaluation uniquement », retirable à court préavis.
  - model_name: ai-gateway
    model_info: { id: groq-qwen-38-27b, max_input_tokens: 5000 }
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      weight: 2
      rpm: 30
      timeout: 45
      max_parallel_requests: 2
      tags: [eval, eval-medium, eval-complex, eval-code, "id:groq-qwen-38-27b"]

  # Essai gratuit Cerebras : crédit unique de 5 $ valable 30 jours, 5 RPM, 1M tokens/jour, contexte 65k.
  - model_name: ai-gateway
    model_info: { id: cerebras-gpt-oss-120b, max_input_tokens: 56000 }
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      weight: 2
      rpm: 5
      timeout: 45
      max_parallel_requests: 2
      tags: [eval, eval-medium, eval-complex, eval-code, "id:cerebras-gpt-oss-120b"]

  # NVIDIA NIM Developer : prototypage et tests uniquement. Aucune limite publiée : rpm 6 par modèle
  # est un choix prudent de cette passerelle. Entrée image non vérifiée : tester --providers avant eval-ocr.
  - model_name: ai-gateway
    model_info: { id: nvidia-glm-5-3-flash }
    litellm_params:
      model: openai/z-ai/glm-5.3-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      weight: 2
      rpm: 6
      timeout: 120
      max_parallel_requests: 1
      tags: [eval, eval-simple, eval-medium, eval-ocr, "id:nvidia-glm-5-3-flash"]

  - model_name: ai-gateway
    model_info: { id: nvidia-nemotron-3-super-120b }
    litellm_params:
      model: openai/nvidia/nemotron-3-super-120b-a12b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      weight: 2
      rpm: 6
      timeout: 120
      max_parallel_requests: 1
      tags: [eval, eval-medium, eval-complex, eval-code, "id:nvidia-nemotron-3-super-120b"]

  - model_name: ai-gateway
    model_info: { id: nvidia-glm-5-3 }
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      weight: 3
      rpm: 6
      timeout: 120
      max_parallel_requests: 1
      tags: [eval, eval-medium, eval-complex, eval-code, "id:nvidia-glm-5-3"]

  - model_name: ai-gateway
    model_info: { id: nvidia-nemotron-3-ultra-550b }
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      weight: 2
      rpm: 6
      timeout: 120
      max_parallel_requests: 1
      tags: [eval, eval-complex, eval-code, "id:nvidia-nemotron-3-ultra-550b"]

  - model_name: ai-gateway
    model_info: { id: nvidia-kimi-k3 }
    litellm_params:
      model: openai/moonshotai/kimi-k3
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      weight: 3
      rpm: 6
      timeout: 120
      max_parallel_requests: 1
      tags: [eval, eval-complex, eval-code, eval-ocr, "id:nvidia-kimi-k3"]

  - model_name: ai-gateway
    model_info: { id: nvidia-deepseek-v41-flash }
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4.1-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      weight: 3
      rpm: 6
      timeout: 120
      max_parallel_requests: 1
      tags: [eval, eval-medium, eval-complex, eval-code, eval-ocr, "id:nvidia-deepseek-v41-flash"]

  # ================================================================ Auto-test de bascule
  # Alias interne utilisé seulement par test_providers.py ; ne jamais le donner aux clés applicatives.
  # La sonde vise un port local fermé (aucun appel externe) : le routeur doit basculer sur la cible.
  - model_name: ai-gateway-selftest
    model_info: { id: test-failover-probe }
    litellm_params:
      model: openai/failover-probe
      api_base: http://127.0.0.1:9/v1
      api_key: not-a-real-key
      weight: 1000
      timeout: 5
      max_retries: 0

  - model_name: ai-gateway-selftest
    model_info: { id: test-failover-target, max_input_tokens: 5000 }
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      weight: 1
      rpm: 30
      timeout: 30

router_settings:
  routing_strategy: simple-shuffle
  enable_weighted_failover: true
  # Jusqu'à 3 tentatives supplémentaires sur d'autres déploiements du même tag (4 modèles au plus).
  max_fallbacks: 3
  enable_tag_filtering: true
  tag_filtering_match_any: true
  enable_pre_call_checks: true
  # Ne jamais réessayer le même déploiement : ce serait dépenser deux fois le même quota.
  num_retries: 0
  timeout: 120
  # 429/401/404/408 mettent un déploiement en cooldown immédiatement ; autres erreurs après 2 échecs/min.
  allowed_fails: 1
  cooldown_time: 120

litellm_settings:
  drop_params: true
  # Une réponse JSON non conforme au schéma est une erreur et bascule vers un autre modèle du même tag.
  enable_json_schema_validation: true
  request_timeout: 120
  set_verbose: false
  json_logs: true
  overwrite_user_with_key_hash: true
  # Jamais de réponse partagée entre clés ou utilisateurs.
  cache: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  maximum_spend_logs_retention_period: "30d"
