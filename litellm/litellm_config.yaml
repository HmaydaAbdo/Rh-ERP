  # ---------------------------------------------------------------- Cloudflare Workers AI
  # 10 000 Neurons/jour partagés par TOUS les modèles du compte (remise à zéro 00:00 UTC). Rester en
  # Workers Free pour 0 $. LiteLLM construit l'URL /ai/v1 depuis CLOUDFLARE_ACCOUNT_ID.
  # Workers AI refuse `content: null` (400, sans bascule) : un message assistant porteur d'appels
  # d'outils doit avoir un contenu chaîne, éventuellement vide (service IA, T6).
  # ---------------------------------------------------------------- Cloudflare Workers AI
  # 10 000 Neurons/jour partagés par TOUS les modèles du compte (remise à zéro 00:00 UTC). Rester en
  # Workers Free pour 0 $. LiteLLM construit l'URL /ai/v1 depuis CLOUDFLARE_ACCOUNT_ID.
  # Workers AI refuse `content: null` (400, sans bascule) : un message assistant porteur d'appels
  # Workers AI ne prend pas le corps multi-message observé avec l'agent LangChain ; gpt-oss-120b reste en code seulement.
  - model_name: ai-gateway-code
    model_info: { id: cloudflare-gpt-oss-120b--code, max_input_tokens: 16000 }
    litellm_params:
      model: cloudflare/@cf/openai/gpt-oss-120b
      api_key: os.environ/CLOUDFLARE_API_KEY
      weight: 2
      timeout: 60
      max_parallel_requests: 2
      tags: [code, "id:cloudflare-gpt-oss-120b"]

