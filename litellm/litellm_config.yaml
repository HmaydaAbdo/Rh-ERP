    model_info: { id: gemini-3.8-flash--code }
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      weight: 5
      timeout: 60
      max_parallel_requests: 3
      tags: [code, ocr, "id:gemini-3.8-flash"]

  - model_name: ai-gateway-ocr
    model_info: { id: gemini-3.8-flash--ocr }
